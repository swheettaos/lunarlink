<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LunarLink API</title>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1c2230; --dim: #6b6a66; --line: #e2e0da; --accent: #d9601a; --get: #2f7d4a; --post: #b4531a; --chip: #ecebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --panel: #1e2128; --ink: #ece9e2; --dim: #9a978f; --line: #2c3039; --accent: #ff8a3d; --get: #6fcf8e; --post: #ffa25e; --chip: #2a2e37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px; z-index: 1; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  input[type=search] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 8px 16px 40px; }
  section { margin-top: 22px; }
  h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 .from { font-weight: normal; color: var(--dim); font-size: 13px; }
  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; }
  .line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 42px; }
  .m.GET { color: var(--get); } .m.POST { color: var(--post); }
  .p { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .h { color: var(--dim); margin-top: 3px; overflow-wrap: anywhere; }
  .none { color: var(--dim); margin-top: 30px; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 2px; }
  .home { display: inline-block; font-size: 13px; color: var(--accent); text-decoration: none; margin-bottom: 4px; }
  .home:hover { text-decoration: underline; }
  .ep { scroll-margin-top: var(--head, 180px); }
  .ep.has { cursor: pointer; }
  .ep.has:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .ep .tw { margin-left: auto; color: var(--dim); font-size: 12px; transition: transform .15s; }
  .ep.open .tw { transform: rotate(90deg); }
  .w { font: 600 11px ui-monospace, monospace; color: var(--post); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
  .d { display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; cursor: auto; }
  .ep.open .d { display: block; }
  .d p { margin: 0 0 8px; }
  .d p.use { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
  .d h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .d table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .d td, .d th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .d th { color: var(--dim); font-weight: 600; font-size: 12px; }
  .d td:first-child { white-space: nowrap; }
  .d .tbl { overflow-x: auto; }
  .d pre { margin: 0; background: var(--chip); border-radius: 6px; padding: 9px 11px; overflow: auto; max-height: 320px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d code, .h code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); border-radius: 3px; padding: 0 4px; }
  .d ul { margin: 0; padding-left: 20px; } .d li { margin: 3px 0; }
  .tools { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; }
  .tools button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
  @media (max-width: 600px) { .d td:first-child { white-space: normal; } }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="https://swheettaos.github.io/lunarlink/">← LunarLink</a>
  <h1>LunarLink API</h1>
  <div class="sub" id="sub"></div>
  <input type="search" id="q" placeholder="Search paths and descriptions (e.g. remove, channel, robots)" autofocus>
  <div class="chips" id="chips"></div>
  <div class="tools"><button id="openall">Open all</button><button id="closeall">Close all</button></div>
</div></header>
<main><div class="wrap" id="list"></div></main>
<script>
const DATA = /*DATA*/null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let group = null;
function hi(text, words) {
  let out = esc(text);
  for (const w of words) if (w) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return out;
}
// a little Markdown: `code` and **bold**
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const open = new Set();
function rows(list) {
  return `<div class="tbl"><table><tr><th>Name</th><th>Type</th><th>Default</th><th>Meaning</th></tr>` +
    list.map(([n, t, d, m]) => `<tr><td><code>${esc(n)}</code></td><td>${esc(t)}</td><td>${esc(d || "-")}</td><td>${md(m)}</td></tr>`).join("") + `</table></div>`;
}
function detail(e) {
  const d = e.d; let h = `<div class="d"><p>${md(d.about || e.help)}</p>`;
  if (d.use) h += `<h4>What it's for</h4><p class="use">${md(d.use)}</p>`;
  if (d.params && d.params.length) h += `<h4>Parameters</h4>` + rows(d.params);
  if (d.body && d.body.length) h += `<h4>Body (JSON)</h4>` + rows(d.body);
  if (d.example) h += `<h4>Example</h4><pre>${esc(d.example.trimEnd())}</pre>`;
  if (d.answer) h += `<h4>Answer</h4><pre>${esc(d.answer.trimEnd())}</pre>`;
  if (d.errors && d.errors.length) h += `<h4>Errors</h4><ul>${d.errors.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  if (d.notes && d.notes.length) h += `<h4>Notes</h4><ul>${d.notes.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  return h + `</div>`;
}
const text = e => [e.method, e.path, e.help, e.d && e.d.about, e.d && e.d.use, e.d && (e.d.notes || []).join(" "), e.d && (e.d.params || []).map(p => p.join(" ")).join(" ")].join(" ").toLowerCase();
function render() {
  const words = document.getElementById("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, html = "";
  for (const g of DATA.groups) {
    if (group && g.group !== group) continue;
    const eps = g.endpoints.filter(e => words.every(w => (text(e) + " " + g.group.toLowerCase()).includes(w)));
    if (!eps.length) continue;
    shown += eps.length;
    html += `<section><h2>${esc(g.group)} <span class="from">${esc(g.from)}</span></h2>` + eps.map(e => {
      const key = e.method + " " + e.path, has = !!e.d;
      return `<div class="ep${has ? " has" : ""}${open.has(key) ? " open" : ""}" data-k="${esc(key)}" id="${esc(e.path.replace(/\//g, "-").replace(/^-/, "") || "root")}">` +
        `<div class="line"><span class="m ${esc(e.method)}">${esc(e.method)}</span><span class="p">${hi(e.path, words)}</span>` +
        (e.method === "POST" && e.d && !/changes nothing/.test(e.help) ? `<span class="w" title="Changes the game: needs allow-writes">writes</span>` : "") +
        (has ? `<span class="tw">▸</span>` : "") + `</div>` +
        (e.help ? `<div class="h">${hi(e.help, words)}</div>` : "") + (has ? detail(e) : "") + `</div>`;
    }).join("") + `</section>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="none">Nothing matches.</div>`;
  const total = DATA.groups.reduce((n, g) => n + g.endpoints.length, 0);
  document.getElementById("sub").textContent = `${shown} of ${total} endpoints` + (DATA.note ? " · " + DATA.note : "");
}
function chips() {
  const names = [null, ...new Set(DATA.groups.map(g => g.group))];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  for (const n of names) {
    const b = document.createElement("button");
    b.className = "chip" + (n === group ? " on" : ""); b.textContent = n ?? "All";
    b.onclick = () => { group = n; chips(); render(); };
    box.appendChild(b);
  }
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("list").addEventListener("click", ev => {
  if (ev.target.closest(".d")) return;                      // selecting text in the details doesn't close them
  const ep = ev.target.closest(".ep.has"); if (!ep) return;
  const k = ep.dataset.k; open.has(k) ? open.delete(k) : open.add(k); ep.classList.toggle("open");
});
const all = on => { for (const g of DATA.groups) for (const e of g.endpoints) if (e.d) on ? open.add(e.method + " " + e.path) : open.delete(e.method + " " + e.path); render(); };
document.getElementById("openall").onclick = () => all(true);
document.getElementById("closeall").onclick = () => all(false);
// a link to #structures-remove opens that endpoint
if (location.hash) {
  for (const g of DATA.groups) for (const e of g.endpoints) if ("#" + e.path.replace(/\//g, "-").replace(/^-/, "") === location.hash) open.add(e.method + " " + e.path);
}
chips(); render();
// the browser jumps to the #anchor itself; each endpoint's scroll-margin keeps it below the sticky header
const setMargin = () => document.documentElement.style.setProperty("--head", document.querySelector("header").offsetHeight + 8 + "px");
setMargin(); addEventListener("resize", setMargin);
if (location.hash) { const el = document.querySelector(location.hash.replace(/[^#\w-]/g, "")); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
