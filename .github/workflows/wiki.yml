# Publishes wiki/ to the GitHub wiki on every push to main: tools/wiki.py fills in the pages built from the docs, the
# endpoint tables and the samples, so the wiki always matches the code. Only the wiki repo is written.
name: wiki
on:
  push:
    branches: [main]
    paths: [wiki/**, docs/**, samples/**, README.md, tools/wiki.py, .github/workflows/wiki.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: wiki
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the wiki
        run: git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki-out
      - name: Build the pages
        run: python3 tools/wiki.py wiki-out
      - name: Publish
        working-directory: wiki-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git commit -q -m "Update from ${GITHUB_SHA::7}"
          git push
