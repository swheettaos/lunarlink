name: Question
description: How do I ... ? Something the docs and wiki don't answer
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The [wiki](https://github.com/swheettaos/lunarlink/wiki) and the [API reference](https://swheettaos.github.io/lunarlink/api.html) answer most questions - worth a look first.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: Optional. The requests, settings or code you tried, and what happened.
