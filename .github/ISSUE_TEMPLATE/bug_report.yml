name: Bug report
description: Something doesn't work as it should - an endpoint, a reload, the F9 window, a freeze
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. The [Troubleshooting](https://github.com/swheettaos/lunarlink/wiki/Troubleshooting) page covers the common problems; if it's not there, tell us below.
  - type: textarea
    id: support
    attributes:
      label: Support file (attach the zip here)
      description: |
        **A support file helps a lot: it has what's needed to find the problem.** With the game running (right after the problem, or after restarting if it crashed), open this address in your browser, then drag the zip it names into the box below or click **Paste, drop, or click to add files** under it:

        ```
        http://127.0.0.1:8765/support
        ```

        Or press **F9** and click **Support file**. Either way it saves `BepInEx/lunarlink-support-<date-time>.zip`: what failed, the errors from the logs (this run's and the previous run's), your plugins and settings. Players' names, Steam ids, your user name, LAN addresses and the access key are blanked out; open the zip if you want to check.

        If the game won't start at all, attach `BepInEx/LogOutput.log` instead.
      placeholder: Drag the lunarlink-support-....zip here
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I called POST /structures/remove?ids=41001 and expected the structure to go, but ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, or the request and its answer if it was an API call.
      placeholder: |
        1. Load a moon
        2. curl -s -X POST "127.0.0.1:8765/..."
        3. The answer was: {...}
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - The API (an endpoint)
        - A hot plugin (loading, reloading, enable/disable)
        - The F9 window
        - Normal BepInEx plugins (the BEPINEX PLUGINS tab)
        - The game froze or crashed
        - Building or installing
        - Something else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything else from the logs (optional)
      description: |
        Lines you think matter, if you want to point at them.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: LunarLink, BepInEx and the game (the support file has them too, so this can be short).
      placeholder: "LunarLink 1.1.0, BepInEx 6.0.0-be.791"
    validations:
      required: false
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The other plugins you run (the BEPINEX PLUGINS tab in F9, or GET /plugins, lists them).
