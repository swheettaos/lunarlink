<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} | LunarLink</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }} | LunarLink">
<meta property="og:image" content="https://swheettaos.github.io/lunarlink/nexus.png">
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1c2230; --dim: #6b6a66; --line: #e2e0da; --accent: #d9601a;
          --accent-soft: #fbe9dc; --code: #f0eee8; --hero1: #1c2230; --hero2: #2b3242; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --panel: #1e2128; --ink: #ece9e2; --dim: #9a978f; --line: #2c3039; --accent: #ff8a3d;
            --accent-soft: #3a2a1f; --code: #191b21; --hero1: #0f1115; --hero2: #1b1f27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  header.bar { background: linear-gradient(160deg, var(--hero1), var(--hero2)); color: #ece9e2; }
  header.bar .wrap { max-width: 1040px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding-top: 14px; padding-bottom: 14px; }
  header.bar .home { color: #ece9e2; text-decoration: none; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; margin-right: auto; }
  header.bar .home span { color: #ff8a3d; }
  header.bar nav { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; }
  header.bar nav a { color: #c9c5bc; text-decoration: none; }
  header.bar nav a:hover { color: #ff8a3d; }

  article { padding: 36px 0 8px; }
  article h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.15; margin: 0 0 18px; letter-spacing: -0.02em; }
  article h2 { font-size: 24px; margin: 44px 0 10px; padding-top: 10px; border-top: 1px solid var(--line); letter-spacing: -0.01em; }
  article h3 { font-size: 18px; margin: 28px 0 8px; }
  article p, article li { max-width: 760px; }
  article li { margin: 4px 0; }
  article ul, article ol { padding-left: 24px; }
  code, pre { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
  pre code { background: none; padding: 0; overflow-wrap: normal; }
  .highlight { background: none; }
  blockquote { margin: 16px 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 10px 10px 0; color: var(--dim); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; }
  td, th { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--dim); font-weight: 600; font-size: 13px; }
  img { max-width: 100%; height: auto; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
  footer { margin-top: 56px; border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--dim); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 22px; }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="home" href="./">Lunar<span>Link</span></a>
  <nav>
    <a href="HOT_PLUGINS.html">Write a hot plugin</a>
    <a href="api.html">API reference</a>
    <a href="https://github.com/swheettaos/lunarlink/wiki">Wiki</a>
    <a href="https://www.nexusmods.com/moonsweepers/mods/158">Nexus Mods</a>
    <a href="https://github.com/swheettaos/lunarlink">GitHub</a>
  </nav>
</div></header>
<main class="wrap"><article>
{{ content }}
</article></main>
<footer><div class="wrap">
  <span>LunarLink is licensed under the <a href="https://github.com/swheettaos/lunarlink/blob/main/LICENSE">GPL-3.0</a>.</span>
  <a href="./">Home</a>
  <a href="https://github.com/swheettaos/lunarlink">Source</a>
  <a href="https://www.nexusmods.com/moonsweepers/mods/158">Nexus Mods</a>
  <a href="https://github.com/swheettaos/lunarlink/issues/new/choose">Report a problem</a>
</div></footer>
</body>
</html>
