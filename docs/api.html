<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LunarLink API</title>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1c2230; --dim: #6b6a66; --line: #e2e0da; --accent: #d9601a; --get: #2f7d4a; --post: #b4531a; --chip: #ecebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --panel: #1e2128; --ink: #ece9e2; --dim: #9a978f; --line: #2c3039; --accent: #ff8a3d; --get: #6fcf8e; --post: #ffa25e; --chip: #2a2e37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px; z-index: 1; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  input[type=search] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 8px 16px 40px; }
  section { margin-top: 22px; }
  h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 .from { font-weight: normal; color: var(--dim); font-size: 13px; }
  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; }
  .line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 42px; }
  .m.GET { color: var(--get); } .m.POST { color: var(--post); }
  .p { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .h { color: var(--dim); margin-top: 3px; overflow-wrap: anywhere; }
  .none { color: var(--dim); margin-top: 30px; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 2px; }
  .home { display: inline-block; font-size: 13px; color: var(--accent); text-decoration: none; margin-bottom: 4px; }
  .home:hover { text-decoration: underline; }
  .ep { scroll-margin-top: var(--head, 180px); }
  .ep.has { cursor: pointer; }
  .ep.has:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .ep .tw { margin-left: auto; color: var(--dim); font-size: 12px; transition: transform .15s; }
  .ep.open .tw { transform: rotate(90deg); }
  .w { font: 600 11px ui-monospace, monospace; color: var(--post); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
  .d { display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; cursor: auto; }
  .ep.open .d { display: block; }
  .d p { margin: 0 0 8px; }
  .d p.use { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
  .d h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .d table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .d td, .d th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .d th { color: var(--dim); font-weight: 600; font-size: 12px; }
  .d td:first-child { white-space: nowrap; }
  .d .tbl { overflow-x: auto; }
  .d pre { margin: 0; background: var(--chip); border-radius: 6px; padding: 9px 11px; overflow: auto; max-height: 320px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d code, .h code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); border-radius: 3px; padding: 0 4px; }
  .d ul { margin: 0; padding-left: 20px; } .d li { margin: 3px 0; }
  .tools { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; }
  .tools button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
  @media (max-width: 600px) { .d td:first-child { white-space: normal; } }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="./">← LunarLink</a>
  <h1>LunarLink API</h1>
  <div class="sub" id="sub"></div>
  <input type="search" id="q" placeholder="Search paths and descriptions (e.g. remove, channel, robots)" autofocus>
  <div class="chips" id="chips"></div>
  <div class="tools"><button id="openall">Open all</button><button id="closeall">Close all</button></div>
</div></header>
<main><div class="wrap" id="list"></div></main>
<script>
const DATA = {"groups": [{"group": "LunarLink", "from": "core", "endpoints": [{"method": "GET", "path": "/status", "help": "Is LunarLink up: its build, whether a world is loaded, game time, queue and frames", "d": {"about": "Whether LunarLink is up, which build is running and whether a moon is loaded. It answers at the main menu too, so a script can wait on it.", "use": "The first call of any script: wait until it answers with `world: true` before doing anything else, and compare `version` with `installed-version` to know whether the game is running the build you installed.", "example": "GET /status", "answer": "{\n \"ok\": true,\n \"version\": \"2026-11-13 15:34:00\",\n \"world\": true,\n \"time\": 1219.458,\n \"queued\": 0,\n \"served\": 27,\n \"frames\": 35214\n}\n", "notes": ["`version` is the core's build stamp; `./build.sh --install` writes the same stamp to `BepInEx/plugins/LunarLink/installed-version`. If they differ, restart the game.", "`world`: a moon is loaded. `time`: game seconds. `queued`: requests waiting for a frame. `served`: requests answered since start. `frames`: frames since start."]}}, {"method": "GET", "path": "/hot/list", "help": "?gc=1 : the hot plugins: state, build, newer build on disk, errors, leftovers, old copies still in memory", "d": {"about": "Every DLL in `BepInEx/hot/`: its state, the loaded build's time, whether a newer build is on disk, its error, leftovers and the old copies still in memory.", "use": "See whether your plugins are running, which failed and why, and whether a newer build is waiting on disk. With `?gc=1`, check that reloads don't pile up old copies in memory (`oldCopiesAlive` should stay 0 or 1).", "params": [["gc", "1", "", "Collect garbage first (three passes), so `oldCopiesAlive` is exact. A short hitch"]], "example": "GET /hot/list?gc=1", "answer": "{\n \"dir\": \"C:\\\\Games\\\\Moon Sweepers\\\\BepInEx\\\\hot\",\n \"bridges\": {\n  \"kept\": 114,\n  \"freed\": 0,\n  \"typesFreed\": 0,\n  \"waiting\": 0,\n  \"problem\": null\n },\n \"plugins\": [\n  {\n   \"name\": \"LunarLink.Api\",\n   \"state\": \"running\",\n   \"built\": \"2026-11-13 15:34:04\",\n   \"error\": null,\n   \"loads\": 1,\n   \"boot\": false,\n   \"newerOnDisk\": false,\n   \"leftovers\": [],\n   \"oldCopiesAlive\": 0,\n   \"oldCopies\": 0\n  },\n  {\n   \"name\": \"LunarLink.Perf\",\n   \"state\": \"running\",\n   \"built\": \"2026-11-13 15:34:04\",\n   \"error\": null,\n   \"loads\": 1,\n   \"boot\": false,\n   \"newerOnDisk\": false,\n   \"leftovers\": [],\n   \"oldCopiesAlive\": 0,\n   \"oldCopies\": 0\n  }\n ]\n}\n", "notes": ["`state`: `running`, `loaded` (waiting for a moon), `disabled` or `failed` (with `error`).", "`boot`: `false` (no `Boot()`), `\"done\"`, or `\"restart to boot\"` when it was turned on after game start.", "`leftovers`: Harmony patches still in after its last `Stop()`, which LunarLink took out.", "`bridges`: the clean-up of Il2CppInterop and Harmony caches that frees old copies."]}}, {"method": "POST", "path": "/hot/reload", "help": "?name= : reload a hot plugin from the build on disk now (and turn it on); ?all=1 : every one with a newer build", "d": {"about": "Reload a hot plugin from the build on disk now: the old copy's `Stop()`, then the new copy's `Start(state)` with what it handed over. Turns the plugin on if it was off.", "use": "The heart of the edit-build-reload loop: after building a plugin into `BepInEx/hot/`, call this and the game runs the new code within a frame. `./build.sh --hot` calls it for you; `?all=1` picks up everything you rebuilt.", "params": [["name", "text", "", "The plugin's name: its DLL's name without `.dll`, as `/hot/list` shows it"], ["all", "1", "", "Instead of `name`: reload every enabled plugin with a newer build on disk"]], "example": "POST /hot/reload?name=HelloHot", "answer": "{\n \"ok\": true,\n \"ms\": 12,\n \"plugin\": {\n  \"name\": \"HelloHot\",\n  \"state\": \"running\",\n  \"built\": \"2026-11-13 16:02:11\",\n  \"error\": null,\n  \"loads\": 4,\n  \"boot\": false,\n  \"newerOnDisk\": false,\n  \"leftovers\": []\n }\n}\n", "errors": ["`{\"error\":\"name= is required\"}`", "`{\"error\":\"no HelloHot.dll\"}`: no such DLL in `BepInEx/hot/`", "`\"ok\": false` with the reason in `plugin.error`: it didn't load, or its `Start` threw; it's unloaded again"], "notes": ["With `all=1` the answer is `{\"ok\":true,\"ms\":40,\"reloaded\":[ ...one entry per plugin... ]}`.", "`./build.sh --hot <Name>` builds, copies and calls this for you."]}}, {"method": "POST", "path": "/hot/enable", "help": "?name= : load and start a hot plugin, and remember it's on", "d": {"about": "Load and start a hot plugin, and remember in `hot.json` that it's on.", "use": "Turn on a plugin you dropped into `BepInEx/hot/` (new DLLs start off), or one you turned off. It's remembered across restarts.", "params": [["name", "text", "", "The plugin's name, as `/hot/list` shows it"]], "example": "POST /hot/enable?name=HelloHot", "answer": "{\n \"ok\": true,\n \"ms\": 9,\n \"plugin\": {\n  \"name\": \"HelloHot\",\n  \"state\": \"running\",\n  \"built\": \"2026-11-13 16:02:11\",\n  \"error\": null,\n  \"loads\": 4,\n  \"boot\": false,\n  \"newerOnDisk\": false,\n  \"leftovers\": []\n }\n}\n", "errors": ["`{\"error\":\"name= is required\"}`", "`{\"error\":\"no HelloHot.dll\"}`"], "notes": ["Before a moon is loaded the plugin is `loaded` and starts once one is."]}}, {"method": "POST", "path": "/hot/disable", "help": "?name= : stop and unload a hot plugin, and remember it's off", "d": {"about": "Stop a hot plugin and unload it from memory, and remember in `hot.json` that it's off. Its code, patches and endpoints leave the game; no restart.", "use": "Take a plugin out of the game completely while it runs: its code, patches and endpoints leave memory. Handy to rule a plugin out when hunting a problem, without restarting.", "params": [["name", "text", "", "The plugin's name, as `/hot/list` shows it"]], "example": "POST /hot/disable?name=HelloHot", "answer": "{\n \"ok\": true,\n \"ms\": 3,\n \"plugin\": {\n  \"name\": \"HelloHot\",\n  \"state\": \"disabled\",\n  \"built\": \"2026-11-13 16:02:11\",\n  \"error\": null,\n  \"loads\": 4,\n  \"boot\": false,\n  \"newerOnDisk\": false,\n  \"leftovers\": []\n }\n}\n", "errors": ["`{\"error\":\"name= is required\"}`", "`{\"error\":\"no HelloHot.dll\"}`"], "notes": ["Disabling `LunarLink.Api` takes every game endpoint with it; `/status` and `/hot/*` stay, so you can turn it back on."]}}, {"method": "POST", "path": "/hot/rescan", "help": "Pick up DLLs added to or removed from BepInEx/hot/", "d": {"about": "Look at `BepInEx/hot/` again: DLLs added since are listed (and stay off until enabled), DLLs removed are stopped and unloaded.", "use": "After copying DLLs into or out of `BepInEx/hot/` by hand, make LunarLink notice them without restarting.", "example": "POST /hot/rescan", "answer": "{\n \"ok\": true,\n \"added\": [\n  \"HelloHot\"\n ],\n \"removed\": []\n}\n"}}]}, {"group": "World", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/structures", "help": "Every structure: id, kind, pos, rotation, support. ?x=&y=&z=&r= within r m of a point; ?kind=1,2; ?since=<id> only newer", "d": {"about": "Every structure in the world: id, kind, position, rotation, what it stands on and what it stores. Filter it: on a big base the full list is thousands of entries.", "use": "Find what's built where: everything near a point (`x,y,z,r`), only one kind (`kind=99`: the robots), or only what a script just built (`since=`). Almost every build or clean-up script starts here.", "params": [["x, y, z", "number", "0", "A world point (the moon's centre is 0,0,0; its surface is about 2000 m out)"], ["r", "number", "every structure", "Only within this many metres of the point"], ["kind", "ids", "every kind", "Only these kinds, comma-separated"], ["since", "int", "", "Only ids above this one: what was just built"]], "example": "GET /structures?x=0&y=1992&z=-11&r=20", "answer": "[\n {\n  \"id\": 44462,\n  \"kind\": 746,\n  \"pos\": [\n   19.059,\n   1992.1,\n   -15.637\n  ],\n  \"yaw\": 0,\n  \"placedPose\": true,\n  \"q\": [\n   -0.006,\n   -0.707,\n   -0.0,\n   0.707\n  ],\n  \"support\": 0,\n  \"stored\": 0\n },\n {\n  \"id\": 44463,\n  \"kind\": 746,\n  \"pos\": [\n   14.639,\n   1992.1,\n   -7.846\n  ],\n  \"yaw\": 0,\n  \"placedPose\": true,\n  \"q\": [\n   0.004,\n   0.973,\n   -0.002,\n   -0.229\n  ],\n  \"support\": 0,\n  \"stored\": 0\n }\n]\n", "notes": ["`yaw` and `q`: rotation as an angle and as a quaternion. `support`: the id it stands on (0 for the ground).", "`/kinds` names the kinds."]}}, {"method": "GET", "path": "/belts", "help": "Every belt piece: id, start/end points and directions, length", "d": {"about": "Every belt piece: id, start and end points with their directions, and length.", "use": "Every belt with its ends and directions: for mapping a base's lines, finding a belt to extend or remove, or checking a script's belts.", "example": "GET /belts", "answer": "[\n {\n  \"id\": 25067,\n  \"start\": [\n   19.067,\n   1992.95,\n   -19.545\n  ],\n  \"startDir\": [\n   -0.989,\n   0.148,\n   0.0\n  ],\n  \"end\": [\n   16.059,\n   1993.4,\n   -19.544\n  ],\n  \"endDir\": [\n   -1,\n   0,\n   0\n  ],\n  \"length\": 3.046\n },\n {\n  \"id\": 25068,\n  \"start\": [\n   19.067,\n   1992.95,\n   -15.644\n  ],\n  \"startDir\": [\n   -0.989,\n   0.148,\n   -0.0\n  ],\n  \"end\": [\n   16.059,\n   1993.4,\n   -15.644\n  ],\n  \"endDir\": [\n   -1,\n   0,\n   0\n  ],\n  \"length\": 3.046\n }\n]\n"}}, {"method": "GET", "path": "/stations", "help": "The stations: index, name, pos, intake sockets", "d": {"about": "The stations (the big depots): index, name, position and their conveyor intake sockets.", "use": "Where the stations are and their conveyor intake sockets: the points to run belts into.", "example": "GET /stations", "answer": "[\n {\n  \"index\": 0,\n  \"name\": \"TheCollector\",\n  \"pos\": [\n   0,\n   1992.1,\n   -10.982\n  ],\n  \"sockets\": [\n   {\n    \"name\": \"Conveyor intake 01\",\n    \"pos\": [\n     -9.811,\n     1993.4,\n     -8.798\n    ],\n    \"fwd\": [\n     -0.446,\n     0,\n     0.895\n    ]\n   },\n   {\n    \"name\": \"Conveyor intake 02\",\n    \"pos\": [\n     -13.301,\n     1993.4,\n     -10.538\n    ],\n    \"fwd\": [\n     -0.446,\n     0,\n     0.895\n    ]\n   }\n  ]\n },\n {\n  \"index\": 1,\n  \"name\": \"The Collector (South station)\",\n  \"pos\": [\n   0,\n   -2000.803,\n   -11.03\n  ],\n  \"sockets\": [\n   {\n    \"name\": \"Conveyor intake 01\",\n    \"pos\": [\n     9.854,\n     -2002.109,\n     -8.836\n    ],\n    \"fwd\": [\n     0.446,\n     0,\n     0.895\n    ]\n   },\n   {\n    \"name\": \"Conveyor intake 02\",\n    \"pos\": [\n     13.359,\n     -2002.109,\n     -10.584\n    ],\n    \"fwd\": [\n     0.446,\n     0,\n     0.895\n    ]\n   }\n  ]\n }\n]\n"}}, {"method": "GET", "path": "/stations/shape", "help": "?index= : every collider of a station as the 8 corners of its box", "d": {"about": "Every collider of a station as the 8 corners of its box: what's solid there.", "use": "The solid parts of a station as boxes: what a building or belt next to it must not overlap.", "params": [["index", "int", "every station", "The station's index (`/stations`)"]], "example": "GET /stations/shape?index=0", "answer": "[\n {\n  \"station\": 0,\n  \"name\": \"TheCollector\",\n  \"trigger\": false,\n  \"enabled\": true,\n  \"corners\": [\n   [\n    17.559,\n    1991.98,\n    10.982\n   ]\n  ]\n }\n]\n"}}, {"method": "GET", "path": "/stations/footprint", "help": "?index=&step= : where a station's building really is (rays down onto its colliders)", "d": {"about": "Where a station's building really is: rays straight down onto its colliders on a grid, as world points.", "use": "Where a station's building really stands on the ground, as points, so a script can plan floors and belts right up to it without guessing from its centre.", "params": [["index", "int", "every station", "The station's index"], ["step", "number", "1", "Grid step in metres (0.5 to 4)"]], "example": "GET /stations/footprint?index=0&step=4", "answer": "[\n [\n  16.031,\n  2006.537,\n  -13.56\n ],\n [\n  16.031,\n  2006.538,\n  -17.56\n ],\n [\n  16.031,\n  2006.538,\n  -21.56\n ]\n]\n"}}, {"method": "GET", "path": "/terrain", "help": "?x=&y=&z=&half=&step= : ground heights on a grid round a point", "d": {"about": "Ground heights on a square grid round a point, in the point's own frame: east, north and up from the moon's centre.", "use": "The ground's height on a grid round a point, before building: to find flat spots, plan posts and raised floors over slopes, or check a belt's slope.", "params": [["x, y, z", "number", "0, 2000, 0", "The centre point"], ["half", "number", "100", "Half the square's side in metres (5 to 400)"], ["step", "number", "2", "Grid step in metres (0.5 to 20)"]], "example": "GET /terrain?x=-19&y=1993&z=-26&half=5&step=2", "answer": "{\n \"centre\": [\n  -19.1,\n  1993,\n  -26.3\n ],\n \"half\": 5,\n \"step\": 2,\n \"n\": 6,\n \"h\": [\n  -1.082,\n  -1.082,\n  -1.082,\n  -1.082,\n  -0.982,\n  -0.982\n ]\n}\n", "notes": ["`h`: `n` x `n` heights in metres relative to the centre, row by row from north to south, each row west to east."]}}, {"method": "GET", "path": "/canisters", "help": "?x=&y=&z=&radius= : capsules near a point: cargo, kg, riding, carried; and the totals", "d": {"about": "Capsules near a point (dust, sand, stone): cargo, kilograms, whether each is riding a belt or carried; and totals for the whole moon.", "use": "See capsules near a point (cargo, weight, riding a belt or lying loose) and the moon's totals: whether a line is moving, or where capsules pile up.", "params": [["x, y, z", "number", "0", "A world point (the moon's centre is 0,0,0; its surface is about 2000 m out)"], ["radius", "number", "200", "Metres round the point"]], "example": "GET /canisters?x=0&y=1992&z=-11&radius=30", "answer": "{\n \"total\": 1302,\n \"riding\": 1302,\n \"near\": [\n  {\n   \"id\": 32542640,\n   \"kg\": 2,\n   \"cargo\": \"Stone\",\n   \"pos\": [\n    10.271,\n    1993.344,\n    -7.876\n   ],\n   \"riding\": true,\n   \"carried\": false\n  },\n  {\n   \"id\": 32542552,\n   \"kg\": 2,\n   \"cargo\": \"Stone\",\n   \"pos\": [\n    -13.352,\n    1993.429,\n    -10.436\n   ],\n   \"riding\": true,\n   \"carried\": false\n  }\n ]\n}\n", "notes": ["`total`: dropped capsules on the moon. `riding`: capsules on belts."]}}, {"method": "GET", "path": "/kinds", "help": "Structure kinds standing in the world; ?all=1 every kind the game defines: name, prefab, price, footprint, height, ports", "d": {"about": "Structure kinds: the ones standing in the world, or with `all=1` every kind the game defines. Name, prefab, price, footprint, height, reach and ports.", "use": "The names, prices, footprints, heights and ports of every structure kind: what a build script needs to choose and place pieces. `all=1` includes kinds not yet built.", "params": [["all", "1", "", "Every kind the game defines, not only those standing"]], "example": "GET /kinds?all=1", "answer": "[\n {\n  \"kind\": 126,\n  \"name\": \"Stilt platform - 4 m\",\n  \"prefab\": \"square_stilts_4m\",\n  \"price\": 10,\n  \"scale\": 1,\n  \"halfFootprint\": [\n   4,\n   4\n  ],\n  \"height\": 4,\n  \"floorOffset\": 0,\n  \"reach\": 30,\n  \"groundTolerance\": 0.12,\n  \"ports\": []\n },\n {\n  \"kind\": 101,\n  \"name\": \"Foundation - 1 m\",\n  \"prefab\": \"square_foundation_1m\",\n  \"price\": 2,\n  \"scale\": 1,\n  \"halfFootprint\": [\n   4,\n   4\n  ],\n  \"height\": 1,\n  \"floorOffset\": 0,\n  \"reach\": 30,\n  \"groundTolerance\": 0.12,\n  \"ports\": []\n }\n]\n"}}, {"method": "GET", "path": "/kit", "help": "The conveyor kit's limits: length, radius, slope, height, price per metre", "d": {"about": "The conveyor kit's limits: shortest and longest belt, tightest radius, steepest slope, lowest and highest point, and the price per metre.", "use": "The belt rules: shortest and longest belt, tightest turn, steepest slope, height limits, price per metre. Check them before planning a route.", "example": "GET /kit", "answer": "{\n \"minLength\": 0.75,\n \"maxLength\": 30,\n \"minRadius\": 0.49,\n \"maxSlope\": 45,\n \"minHeight\": 0.35,\n \"maxHeight\": 6,\n \"deckHeight\": 0.85,\n \"pricePerMetre\": 0.5,\n \"builder\": true\n}\n", "errors": ["`{\"error\":\"no conveyor kit\"}`"]}}, {"method": "GET", "path": "/specs", "help": "Machine recipes: batch sizes, cycle times, slots, belt speed", "d": {"about": "Machine recipes and belt numbers: batch sizes, cycle times, power, slots, belt speed and spacing.", "use": "Machine recipes and belt numbers (batch sizes, cycle times, power, belt speed): for working out how many machines a line needs.", "example": "GET /specs", "answer": "{\n \"chamberBatchKg\": 5,\n \"pressDustPerBlockKg\": 1,\n \"pressSandPerBlockKg\": 1,\n \"stoneBlockKg\": 2,\n \"chamberPartBatchSeconds\": 3,\n \"beltSpeed\": 1.1,\n \"beltSpacing\": 0.75,\n \"machines\": [\n  {\n   \"kind\": 96,\n   \"name\": \"Pressure chamber\",\n   \"product\": \"sand\",\n   \"runningKw\": 10,\n   \"cycleSeconds\": 12,\n   \"output\": 2,\n   \"slots\": [\n    {\n     \"name\": \"Dust\",\n     \"cargo\": \"Dust\",\n     \"capacity\": 20\n    }\n   ]\n  }\n ]\n}\n"}}, {"method": "GET", "path": "/sun", "help": "The sun: direction, height, lunar day length, clock", "d": {"about": "The sun: its direction, its height in degrees, the lunar day's length and the clock.", "use": "Where the sun is and the time of the lunar day: plan solar panels, or time something for daylight.", "example": "GET /sun", "answer": "{\n \"time\": 1220.35,\n \"lunarDaySeconds\": 3600,\n \"clockSpeed\": 1,\n \"clockOffset\": 0,\n \"spinAxis\": [\n  -0.622,\n  0.736,\n  0.268\n ],\n \"skySun\": [\n  0.045,\n  0.375,\n  -0.926\n ],\n \"sunlightDir\": [\n  0.045,\n  0.375,\n  -0.926\n ],\n \"sunHeight\": 22.742\n}\n", "errors": ["`{\"error\":\"no solar system\"}`"]}}, {"method": "GET", "path": "/moon", "help": "The cleaned share of the moon, as the map screen shows it", "d": {"about": "The cleaned share of the moon, as the map screen shows it.", "use": "How much of the moon is clean, as the map screen shows it: a progress number for scripts or overlays.", "example": "GET /moon", "answer": "{\n \"labels\": [\n  \"43.7%\"\n ]\n}\n", "notes": ["`labels` is empty until the map screen has been opened once."]}}, {"method": "GET", "path": "/dust/regions", "help": "Every region not complete: index, centre, dust left, dust it started with", "d": {"about": "Every dust region not yet complete: its index, centre direction, dust left and dust it started with.", "use": "Which regions of the moon still have dust, and how much: send robots or a cleaning run where it's needed. Large: filter it in your script.", "example": "GET /dust/regions", "answer": "{\n \"ok\": true,\n \"count\": 163842,\n \"radius\": 1992.13,\n \"dusty\": [\n  [\n   2,\n   -0.526,\n   -0.851,\n   0.0,\n   12.5,\n   40.0\n  ]\n ],\n \"left\": 154083\n}\n", "notes": ["**Large:** each entry is `[index, x, y, z, left, started]`, and a fresh moon has over 150,000 (about 6 MB).", "`count`: regions on the moon; `left`: regions not complete."]}}, {"method": "GET", "path": "/dust/geometry", "help": "Region centres and chunk-file centres, written to dust_geometry.json for offline save editing", "d": {"about": "Writes every region centre, and the centre of each chunk file named in `chunk_names.txt`, to `dust_geometry.json` in `BepInEx/plugins/LunarLink/`, for editing the save's dust offline.", "use": "For save editing: writes the region and chunk-file centres to a file, to edit the save's dust offline.", "example": "GET /dust/geometry", "answer": "{\n \"ok\": true,\n \"regions\": 163842,\n \"chunks\": 12,\n \"chunkMisses\": 0,\n \"chunkCount\": 642\n}\n", "notes": ["A GET that writes a file (it changes nothing in the game)."]}}]}, {"group": "Base", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/production", "help": "Every production machine: cycles, progress, power, status, stored dust/sand/stone per slot", "d": {"about": "Every production machine (pressure chambers and stone presses): cycles done, progress, power, the game's status text and what each input and output slot holds.", "use": "A full report of every press and chamber: what's running, what's starved of dust or sand, what's waiting on power. Use `/base/health` first to find a problem; then this to look at the machines involved.", "example": "GET /production", "answer": "{\n \"clock\": 0.2,\n \"machines\": [\n  {\n   \"id\": 44430,\n   \"kind\": 97,\n   \"cycles\": 201,\n   \"progress\": 0.98,\n   \"running\": true,\n   \"power\": 1,\n   \"demandKw\": 18,\n   \"usedKw\": 18,\n   \"lastCycle\": 1207.264,\n   \"lastInput\": 1207.365,\n   \"status\": \"\",\n   \"flow\": \"\",\n   \"powerStatus\": \"\",\n   \"slots\": [\n    {\n     \"name\": \"Dust\",\n     \"stored\": 12,\n     \"capacity\": 12\n    }\n   ]\n  }\n ]\n}\n", "notes": ["`kind`: 96 pressure chamber, 97 stone press (see `/specs`).", "`status`, `flow`, `powerStatus`: the game's own text when it's waiting or stuck; empty when it's fine.", "`lastCycle`, `lastInput`: game time of the last finished cycle and the last capsule in.", "On a big base this is long (hundreds of machines): use `/base/health` to find problems."]}}, {"method": "GET", "path": "/catchers", "help": "Every capsule catcher: kg stored, full, and whether its outlet works", "d": {"about": "Every capsule catcher: kilograms stored, whether it's full and whether its outlet works.", "use": "See which capsule catchers are full and whether their outlets move capsules on: a full catcher with a dead outlet is a base that has stopped.", "example": "GET /catchers", "answer": "{\n \"storeKg\": 100,\n \"catchers\": [\n  {\n   \"id\": 44606,\n   \"kg\": 215.26,\n   \"full\": true,\n   \"outfeed\": true\n  },\n  {\n   \"id\": 44607,\n   \"kg\": 134.568,\n   \"full\": true,\n   \"outfeed\": true\n  }\n ]\n}\n", "notes": ["`storeKg`: what a catcher holds before it counts as full.", "`outfeed`: its outlet is connected and moving capsules on."]}}, {"method": "GET", "path": "/power", "help": "The solar grids: supply, demand, use, satisfaction, battery charge; and the panel types", "d": {"about": "The solar panel types, and every power grid: panels, machines, supply, demand, use, satisfaction and battery charge.", "use": "Check each solar grid has enough supply for its machines, and how much battery is left for the night.", "example": "GET /power", "answer": "{\n \"panels\": {\n  \"post\": {\n   \"name\": \"Solar post\",\n   \"peakKw\": 3,\n   \"batteryKwh\": 0,\n   \"range\": 16\n  },\n  \"twin\": {\n   \"name\": \"Solar twin\",\n   \"peakKw\": 7.5,\n   \"batteryKwh\": 4,\n   \"range\": 24\n  },\n  \"tracker\": {\n   \"name\": \"Solar tracker\",\n   \"peakKw\": 16,\n   \"batteryKwh\": 10,\n   \"range\": 34\n  }\n },\n \"grids\": [\n  {\n   \"id\": 44430,\n   \"panels\": 108,\n   \"machines\": 48,\n   \"supplyKw\": 1655.03,\n   \"demandKw\": 736,\n   \"usedKw\": 736,\n   \"peakKw\": 1728,\n   \"satisfaction\": 1,\n   \"storedKwh\": 578.631,\n   \"capacityKwh\": 1080\n  },\n  {\n   \"id\": 44946,\n   \"panels\": 108,\n   \"machines\": 48,\n   \"supplyKw\": 1634.172,\n   \"demandKw\": 736,\n   \"usedKw\": 736,\n   \"peakKw\": 1728,\n   \"satisfaction\": 1,\n   \"storedKwh\": 299.045,\n   \"capacityKwh\": 1080\n  }\n ]\n}\n", "notes": ["`satisfaction`: the share of demand met (1 = all).", "`storedKwh` / `capacityKwh`: the grid's batteries."]}}, {"method": "GET", "path": "/base/health", "help": "?x=&y=&z=&r=100 : is a base working - machines the game says are stuck (and why), catchers with a dead outlet, robots docked here not cleaning, and power grids short anywhere; idle machines are only counted", "d": {"about": "Is the base round a point working? Lists only real problems: machines the game says are stuck (with its reason), catchers with a dead outlet, robots docked there that aren't cleaning, and power grids short anywhere. Idle machines are only counted.", "use": "One call answers \"is this base working?\": it lists only real problems (stuck machines with the game's reason, catchers with a dead outlet, idle robots docked there, short power grids). Run it round a base after building or changing it, or from a script on a timer.", "params": [["x, y, z", "number", "0", "A world point (the moon's centre is 0,0,0; its surface is about 2000 m out)"], ["r", "number", "100", "Radius in metres round the point"]], "example": "GET /base/health?x=0&y=1992&z=-11&r=150", "answer": "{\n \"machines\": [],\n \"catchers\": [],\n \"robots\": [],\n \"shortGrids\": [],\n \"here\": {\n  \"machines\": 468,\n  \"idleMachines\": 324,\n  \"catchers\": 48,\n  \"robots\": 0\n },\n \"problems\": 0,\n \"ok\": true\n}\n", "notes": ["Problem shapes: `machines` `{id, kind, status, flow, power}`; `catchers` `{id, kg, full, outlet}`; `robots` `{dock, number, status, kg}`; `shortGrids` `{id, machines, satisfaction, supplyKw, demandKw, storedKwh}`.", "`here`: what's within the radius. `ok` is true when `problems` is 0."]}}, {"method": "GET", "path": "/robots", "help": "Every J.O.O.N.A.S.: the game's robot map (dock, state, kg carried) with the region under it", "d": {"about": "Every J.O.O.N.A.S. robot from the game's robot map: its dock, number, owner, status text, position, kilograms carried, bin size and the dust region under it.", "use": "Find where every J.O.O.N.A.S. is, what it's doing (\"Cleaning Sector 14933\", \"No dusty sector found nearby\"), and how full its bin is: robots that ran out of nearby dust need moving.", "example": "GET /robots", "answer": "{\n \"ok\": true,\n \"type\": \"MoonCleaners.MoonWorld+MapRobot\",\n \"count\": 120,\n \"robots\": [\n  {\n   \"dock\": 45964,\n   \"number\": 1,\n   \"kind\": \"Joonas\",\n   \"owner\": \"local\",\n   \"status\": \"No dusty sector found nearby\",\n   \"position\": [\n    -80.468,\n    1993.248,\n    18.3\n   ],\n   \"near\": true,\n   \"on\": true,\n   \"kilograms\": 16.8,\n   \"bin\": 60,\n   \"region\": 48003,\n   \"regionComplete\": false\n  },\n  {\n   \"dock\": 45965,\n   \"number\": 2,\n   \"kind\": \"Joonas\",\n   \"owner\": \"local\",\n   \"status\": \"Cleaning Sector 14933\",\n   \"position\": [\n    -1052.351,\n    1694.588,\n    -77.264\n   ],\n   \"near\": true,\n   \"on\": true,\n   \"kilograms\": 14.675,\n   \"bin\": 60,\n   \"region\": 14933,\n   \"regionComplete\": false\n  }\n ]\n}\n", "notes": ["`dock` is the robot's structure id. Starter robots have ids over a billion.", "`near`: close enough to the player for the game to simulate it fully."]}}]}, {"group": "Build", "from": "LunarLink.Api", "endpoints": [{"method": "POST", "path": "/structures/check", "help": "Body {kind, pos:[x,y,z], q:[x,y,z,w], support, raised, free, snapped}: the game's own placement check; builds nothing (changes nothing)", "d": {"about": "Ask the game whether a structure could be placed: its own placement check, the one the build tool's blue preview waits for. Builds nothing.", "use": "Before building anything from a script, ask the game whether it fits: the same check as the build tool's blue preview. Nothing is spent and nothing changes, so a script can try positions until one fits.", "body": [["kind", "int", "", "The structure kind (`/kinds?all=1` lists them)"], ["pos", "[x,y,z]", "", "Where it goes, in world coordinates"], ["q", "[x,y,z,w]", "no rotation", "Its rotation as a quaternion"], ["support", "int", "-1", "The id of the structure it stands on (a floor or post); -1 for the ground"], ["raised, free, snapped", "true/false", "false", "The build tool's own flags: on a raised floor, free placement, snapped to a grid"], ["hint", "text", "", "The build tool's placement hint, if any"]], "example": "POST /structures/check\n{\"kind\":101,\"pos\":[12.5,1992.1,-4],\"q\":[0,0,0,1],\"support\":-1}\n", "answer": "{\n \"ok\": true,\n \"reason\": null,\n \"check\": {\n  \"done\": true,\n  \"valid\": true,\n  \"reason\": null\n },\n \"multiLevel\": true,\n \"multiLevelReason\": null\n}\n", "errors": ["`{\"error\":\"no local player\"}`", "`\"ok\": false` with the game's `reason` (for example something in the way, or too steep)"], "notes": ["A POST because it carries a body, but it changes nothing: it works without `allow-writes`.", "`multiLevel`: whether the game's stacking check accepts it (floors on posts, and so on)."]}}, {"method": "POST", "path": "/structures/create", "help": "Same body: build it with the game's TryBuildStructure (the player within about 22 m). Returns its id", "d": {"about": "Build a structure with the game's own `TryBuildStructure`: the same check, then built and paid for like the build tool would.", "use": "Build a structure from a script: floors, posts, machines, catchers, robots. The game checks and charges it exactly as if you'd placed it by hand. Move the player within 22 m first (`/player/modify`), then confirm with `/structures?since=`.", "body": [["kind", "int", "", "The structure kind (`/kinds?all=1` lists them)"], ["pos", "[x,y,z]", "", "Where it goes, in world coordinates"], ["q", "[x,y,z,w]", "no rotation", "Its rotation as a quaternion"], ["support", "int", "-1", "The id of the structure it stands on (a floor or post); -1 for the ground"], ["raised, free, snapped", "true/false", "false", "The build tool's own flags: on a raised floor, free placement, snapped to a grid"], ["hint", "text", "", "The build tool's placement hint, if any"]], "example": "POST /structures/create\n{\"kind\":101,\"pos\":[12.5,1992.1,-4],\"q\":[0,0,0,1],\"support\":-1}\n", "answer": "{\n \"ok\": true,\n \"reason\": null,\n \"id\": 45012,\n \"check\": {\n  \"done\": true,\n  \"valid\": true,\n  \"reason\": null\n }\n}\n", "errors": ["`{\"error\":\"no local player\"}`", "`\"ok\": false` with the game's `reason`; `id` is -1"], "notes": ["The player must be within about 22 m: move them first with `POST /player/modify`.", "Check with `/structures/check` first; `GET /structures?since=<id>` shows what was just built."]}}, {"method": "POST", "path": "/structures/remove", "help": "?ids=1,2,3[&refund=0][&robot=1] : out of the world from anywhere, refund paid unless refund=0; robots only with robot=1. One at a time with a gap", "d": {"about": "Take structures out of the world from anywhere, without moving the player. The game's normal refund is paid into the team's money unless `refund=0`.", "use": "Take down structures from anywhere on the moon with the normal refund: clearing an old base, undoing a script's mistake. Remove one at a time, about a quarter of a second apart, or the game freezes.", "params": [["ids", "ids", "", "Comma-separated structure ids"], ["refund", "0", "pays", "`0`: don't pay the refund"], ["robot", "1", "skips robots", "`1`: J.O.O.N.A.S. robots (kind 99) may be removed too"]], "example": "POST /structures/remove?ids=41001", "answer": "{\n \"ok\": true,\n \"removed\": 1,\n \"skipped\": 0,\n \"missing\": 0,\n \"left\": 0,\n \"refund\": 12.5\n}\n", "notes": ["**Remove one at a time with about 0.25 s between.** The game's removal costs about 15 ms after a pause but 100-130 ms straight after another; a batch freezes the game.", "`skipped`: robots left because `robot=1` wasn't given. `missing`: ids that weren't there. `ok` is false when anything asked for is still standing."]}}, {"method": "POST", "path": "/belts/check", "help": "Body {start, startDir, end, endDir, startStructure, endStructure, startBelt, endBelt}: can this belt be built, its length and price (changes nothing)", "d": {"about": "Ask the game whether a belt can be built between two points: whether it's routable, its length and its price. Builds nothing.", "use": "Before laying a belt from a script, ask whether the game will accept that route, how long it is and what it costs. Use `/kit` for the limits (longest belt, tightest turn, steepest slope).", "body": [["start, end", "[x,y,z]", "", "Where the belt starts and ends"], ["startDir, endDir", "[x,y,z]", "forward", "Its direction at each end"], ["startStructure, endStructure", "int", "-1", "The machine or catcher port it connects to at each end, by structure id"], ["startBelt, endBelt", "int", "-1", "The belt it continues from or into, by belt id"], ["replaces", "int", "-1", "A belt this one replaces"], ["startUp, endUp", "[x,y,z]", "away from the moon's centre", "The up direction at each end"]], "example": "POST /belts/check\n{\"start\":[10,2000,-4],\"startDir\":[1,0,0],\"end\":[20,2000,-4],\"endDir\":[1,0,0]}\n", "answer": "{\n \"ok\": true,\n \"reason\": null,\n \"routable\": true,\n \"length\": 10.02,\n \"price\": \"5.01\"\n}\n", "errors": ["`{\"error\":\"no local player\"}`", "`\"ok\": false` with the game's `reason`"], "notes": ["Works without `allow-writes`: it changes nothing.", "`price` is a string (the game's decimal). `/kit` has the limits: length, radius, slope, height."]}}, {"method": "POST", "path": "/belts/create", "help": "Same body: build the belt (the player within about 22 m). Returns its id", "d": {"about": "Build a belt with the game's own `TryBuildConveyor`, paid for like the build tool would.", "use": "Lay a belt between two points or two machines' ports from a script, paid for as by hand. Connect it to machines with `startStructure` / `endStructure`.", "body": [["start, end", "[x,y,z]", "", "Where the belt starts and ends"], ["startDir, endDir", "[x,y,z]", "forward", "Its direction at each end"], ["startStructure, endStructure", "int", "-1", "The machine or catcher port it connects to at each end, by structure id"], ["startBelt, endBelt", "int", "-1", "The belt it continues from or into, by belt id"], ["replaces", "int", "-1", "A belt this one replaces"], ["startUp, endUp", "[x,y,z]", "away from the moon's centre", "The up direction at each end"]], "example": "POST /belts/create\n{\"start\":[10,2000,-4],\"startDir\":[1,0,0],\"end\":[20,2000,-4],\"endDir\":[1,0,0]}\n", "answer": "{\n \"ok\": true,\n \"reason\": null,\n \"id\": 25512\n}\n", "errors": ["`{\"error\":\"no local player\"}`", "`\"ok\": false` with the game's `reason`"], "notes": ["The player must be within about 22 m: move them first with `POST /player/modify`."]}}, {"method": "POST", "path": "/belts/remove", "help": "?ids=1,2,3 : belts out with the game's undo, from anywhere, refunded", "d": {"about": "Take belts out with the game's own undo, from anywhere; the game refunds them itself.", "use": "Remove belts from anywhere, refunded: rerouting a line, or clearing up after a test.", "params": [["ids", "ids", "", "Comma-separated belt ids (`/belts` lists them)"]], "example": "POST /belts/remove?ids=25067", "answer": "{\n \"ok\": true,\n \"asked\": 1,\n \"missing\": 0,\n \"left\": 0,\n \"refund\": 1.52\n}\n", "errors": ["`{\"error\":\"no local player\"}`"], "notes": ["`refund`: how much the team's money went up."]}}, {"method": "POST", "path": "/canisters/remove", "help": "?id= : delete one loose capsule (not riding, carried or flying)", "d": {"about": "Delete one loose capsule lying on the ground.", "use": "Delete a stray capsule lying on the ground, for example one that fell off a belt and blocks a path.", "params": [["id", "int", "", "The capsule's id (`/canisters` lists them)"]], "example": "POST /canisters/remove?id=32542640", "answer": "{\n \"ok\": true,\n \"kg\": 2\n}\n", "errors": ["`{\"ok\":false,\"reason\":\"no such canister\"}`", "`{\"ok\":false,\"reason\":\"canister is riding, carried or flying\"}`: only loose ones can go"]}}, {"method": "GET", "path": "/builder", "help": "The player's build tool: placing, ghost kind, valid, reason, plan, what overlaps the preview", "d": {"about": "The player's own build tool: whether it's placing, the kind on it, whether the preview is valid and why not, its placement plan, and what overlaps the preview.", "use": "See what the player's own build tool is showing: the piece it's placing, whether the preview is valid, and if not, the game's reason and what it overlaps. The way to understand why a placement is refused.", "example": "GET /builder", "answer": "{\n \"placing\": false,\n \"ghostKind\": 0,\n \"valid\": false,\n \"reason\": \"\",\n \"plan\": {},\n \"overlaps\": null\n}\n", "errors": ["`{\"error\":\"no build tool\"}`"], "notes": ["`overlaps`: every collider in a foundation-sized box at the preview, which is what \"overlaps another tile\" means."]}}, {"method": "POST", "path": "/builder/aim", "help": "Body {kind, from:[x,y,z], to:[x,y,z], wheel, free}: pick a kind and aim the real build tool", "d": {"about": "Pick a structure kind on the real build tool and aim it along a ray, as the camera would; the game then makes its own placement preview (stacking included).", "use": "Drive the real build tool from a script: choose a piece and point it, and the game makes its own preview, stacking on floors and posts included. Useful when you want exactly what a player would get, rather than `/structures/create`'s direct placement.", "body": [["kind", "int", "", "The structure kind to place"], ["from, to", "[x,y,z]", "", "The aim ray: from a point towards another"], ["wheel", "number", "0", "The rotate wheel, as the mouse wheel turns it"], ["free", "true/false", "false", "Free placement"]], "example": "POST /builder/aim\n{\"kind\":101,\"from\":[10,2006,-4],\"to\":[12,1992,-4]}\n", "answer": "(the same answer as GET /builder)\n", "errors": ["`{\"error\":\"no build tool\"}`"], "notes": ["Then `POST /builder/place` presses place; `GET /builder` shows whether the preview is valid first."]}}, {"method": "POST", "path": "/builder/place", "help": "Press place on the aimed build tool", "d": {"about": "Press place on the build tool, as aimed by `/builder/aim`.", "use": "Press \"place\" on the build tool after `/builder/aim`, as a player clicking.", "example": "POST /builder/place", "answer": "{\n \"ok\": true,\n \"pressed\": true\n}\n", "errors": ["`{\"error\":\"aim first\"}`"]}}, {"method": "POST", "path": "/builder/stop", "help": "Put the build tool down", "d": {"about": "Put the build tool down and cancel any placement.", "use": "Put the build tool away again after a script used it.", "example": "POST /builder/stop", "answer": "{\n \"ok\": true\n}\n", "errors": ["`{\"error\":\"no build tool\"}`"]}}]}, {"group": "Player", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/player", "help": "The local player: pos, forward, pitch, heading, camera forward", "d": {"about": "The local player: position, facing, pitch, heading and where the camera looks.", "use": "Where the player is and which way they look: a script's starting point for building near them, or for putting the observer camera behind them.", "example": "GET /player", "answer": "{\n \"pos\": [\n  -19.063,\n  1993.0,\n  -26.29\n ],\n \"forward\": [\n  0.993,\n  0.008,\n  -0.119\n ],\n \"pitch\": 20.88,\n \"lookPitch\": 20.88,\n \"heading\": [\n  0.993,\n  0.008,\n  -0.119\n ],\n \"camForward\": [\n  0.931,\n  -0.349,\n  -0.107\n ]\n}\n", "errors": ["`{\"error\":\"no local player\"}`"]}}, {"method": "POST", "path": "/player/modify", "help": "?x=&y=&z= : move the player there with the game's teleport (ignored while they're in a vehicle)", "d": {"about": "Move the local player with the game's own teleport. They land on the surface above the point.", "use": "Move the player anywhere on the moon. Scripts use it to stand within building reach (about 22 m) of where they build next; it's also a quick way to reach a far base.", "params": [["x, y, z", "number", "0", "A world point (the moon's centre is 0,0,0; its surface is about 2000 m out)"]], "example": "POST /player/modify?x=10&y=2001&z=-4", "answer": "{\n \"ok\": true,\n \"pos\": [\n  10.0,\n  1992.4,\n  -4.0\n ]\n}\n", "errors": ["`{\"error\":\"no local player\"}`"], "notes": ["Ignored while the player is in a vehicle.", "Building needs the player within about 22 m; removing doesn't."]}}, {"method": "GET", "path": "/camera", "help": "Which camera draws: the game's or the observer camera, and where it is", "d": {"about": "Which camera draws: the game's, or the observer camera with where it is and where it looks.", "use": "Find out whether the observer camera is on and where it is.", "example": "GET /camera", "answer": "{\n \"camera\": \"game\"\n}\n", "notes": ["With the observer camera on: `{\"camera\":\"observer\",\"pos\":[...],\"forward\":[...]}`."]}}, {"method": "POST", "path": "/camera/modify", "help": "?x=&y=&z=&tx=&ty=&tz=[&fov=][&hide=1] : the observer camera there, looking at t; hide=1 stops the game's camera drawing", "d": {"about": "Put an observer camera somewhere, looking at a point: a second camera drawn on top of the game's, which stays where it's put while the player moves (for recording). The game's look-at cards are hidden while it's on.", "use": "**Film or watch from a fixed angle.** An observer camera stays where you put it while the player walks about, so a script can build a base with the player running from spot to spot and the picture stays steady: for recording a timelapse, watching a long build, or a screenshot from the sky. `hide=1` stops the game's own camera drawing underneath, which is cheaper. The game's info cards stay hidden while it's on.", "params": [["x, y, z", "number", "0", "Where the camera stands"], ["tx, ty, tz", "number", "0", "The point it looks at"], ["fov", "number", "the game's", "Field of view in degrees"], ["hide", "1", "", "`1`: the game's own camera stops drawing underneath (cheaper)"]], "example": "POST /camera/modify?x=40&y=2030&z=-40&tx=0&ty=1992&tz=-11&hide=1", "answer": "{\n \"ok\": true,\n \"camera\": \"observer\",\n \"pos\": [\n  40,\n  2030,\n  -40\n ],\n \"fov\": 60\n}\n"}}, {"method": "POST", "path": "/camera/remove", "help": "Remove the observer camera and give the game's camera back", "d": {"about": "Remove the observer camera and give the view back to the game's camera.", "use": "Give the view back to the game's own camera when you're done filming or watching.", "example": "POST /camera/remove", "answer": "{\n \"ok\": true,\n \"camera\": \"game\",\n \"mask\": -1\n}\n"}}, {"method": "POST", "path": "/message", "help": "?text=[&ttl=15][&y=0.5][&size=20] : a line of text on screen; empty text hides it", "d": {"about": "Show a line of text on screen, in the game's font (for a script's status while it builds). Empty text hides it.", "use": "Show a script's progress on screen in the game's own font (\"Building row 3 of 12\"), so you can follow a long job while playing or recording. Empty text hides it; `ttl` takes it down by itself.", "params": [["text", "text", "", "The text; empty hides the message"], ["ttl", "number", "15", "Seconds it stays up; 0 until replaced"], ["y", "number", "0.5 (or the last one)", "Height on screen, 0 bottom to 1 top"], ["size", "number", "20 (or the last one)", "Font size"]], "example": "POST /message?text=Building row 3 of 12&ttl=30", "answer": "{\n \"ok\": true,\n \"copied\": \"Label on HUD\",\n \"screen\": [\n  2560,\n  1440\n ]\n}\n", "errors": ["`{\"ok\":false,\"reason\":\"no on-screen text to copy\"}`"]}}, {"method": "POST", "path": "/clean", "help": "?x=&y=&z=&r=&a= : the game's own CleanAt round a point", "d": {"about": "Run the game's own `CleanAt` round a point: clears dust there, as the player's sweeping does.", "use": "Clear dust round a point without walking there, exactly as the player's sweeping does: tidying a build site, or clearing a path for belts.", "params": [["x, y, z", "number", "0", "A world point (the moon's centre is 0,0,0; its surface is about 2000 m out)"], ["r", "number", "4", "Radius in metres"], ["a", "number", "1", "Amount"]], "example": "POST /clean?x=12&y=1993&z=-4&r=6", "answer": "{\n \"ok\": true,\n \"returned\": 37\n}\n", "notes": ["`returned`: what the game's `CleanAt` returned."]}}]}, {"group": "Game", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/game/money", "help": "The team's money", "d": {"about": "The team's money.", "use": "Read the team's money from a script, for example to stop a build script before it runs out.", "example": "GET /game/money", "answer": "{\n \"money\": 1250000.5\n}\n"}}, {"method": "GET", "path": "/debug/threads", "help": "Every thread of the game's process: id, state, CPU seconds, when it started (for a hang)", "d": {"about": "Every thread of the game's process as the system sees it: id, state, CPU seconds used and when it started. For a game that hangs but still answers.", "use": "When the game hangs but still answers, see which threads are busy and which started late: a first step in finding a freeze.", "example": "GET /debug/threads", "answer": "{\n \"threads\": [\n  {\n   \"id\": 316,\n   \"state\": \"Initialized\",\n   \"cpu\": 794.75,\n   \"started\": \"15:38:10\"\n  },\n  {\n   \"id\": 372,\n   \"state\": \"Initialized\",\n   \"cpu\": 0,\n   \"started\": \"15:38:10\"\n  }\n ],\n \"count\": 110\n}\n", "notes": ["Threads that started late (when quitting, say) or keep using CPU are the ones to look at."]}}]}, {"group": "Host", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/lobby", "help": "What the hosted game publishes to Steam: the crew name and every lobby key", "d": {"about": "What your hosted game publishes to Steam: whether you're in a lobby and host, the crew name, privacy, the lobby id and every lobby key.", "use": "See exactly what your hosted game publishes to Steam's server list: the crew name, privacy and every lobby key.", "example": "GET /lobby", "answer": "{\n \"inLobby\": true,\n \"isHost\": true,\n \"crewName\": \"Moon Crew\",\n \"privacy\": \"InviteOnly\",\n \"lobbyId\": 109775244470000000,\n \"data\": {\n  \"game\": \"moonsweepers\",\n  \"name\": \"Moon Crew\",\n  \"privacy\": \"2\",\n  \"state\": \"shift\",\n  \"version\": \"1.0.5\"\n }\n}\n"}}, {"method": "POST", "path": "/lobby/modify", "help": "?name= sets the hosted game's name; or ?key=&value= sets one lobby key. Host only", "d": {"about": "Set your hosted game's name in the server list (the game has no box for it), or set one lobby key directly. Host only.", "use": "Give your hosted game a proper name in the server list (the game has no box to type one), or set a lobby key directly.", "params": [["name", "text", "", "The new crew name, 1-60 characters. Changes the game's field, every lobby key that held the old name, then refreshes the lobby"], ["key, value", "text", "", "Instead of `name`: set one lobby key"]], "example": "POST /lobby/modify?name=Night Shift", "answer": "{\n \"ok\": true,\n \"old\": \"Moon Crew\",\n \"name\": \"Night Shift\",\n \"keysChanged\": [\n  \"name\"\n ]\n}\n", "errors": ["`{\"ok\":false,\"reason\":\"host a game first\"}`", "`{\"ok\":false,\"reason\":\"name must be 1-60 characters\"}`"]}}, {"method": "GET", "path": "/vehicles", "help": "Every owned vehicle: storage id, owner, garage, type, in the world or stored, price", "d": {"about": "Every owned vehicle (storage id, owner, garage, type, whether it's out in the world, price), the garage's offers, and the team's money.", "use": "See every vehicle the crew owns, who owns it, whether it's out in the world, and what each would refund.", "example": "GET /vehicles", "answer": "{\n \"ok\": true,\n \"owned\": [\n  {\n   \"storage\": \"g2-0\",\n   \"owner\": \"76561198000000000\",\n   \"ownerName\": \"Crewmate\",\n   \"garage\": 2,\n   \"vehicle\": 1,\n   \"inWorld\": true,\n   \"spawned\": true,\n   \"price\": 1000\n  }\n ],\n \"offers\": [\n  {\n   \"vehicle\": 0,\n   \"price\": 300,\n   \"summary\": \"Walk behind it: a 1.35 m sweep and a 100 kg hopper.\"\n  },\n  {\n   \"vehicle\": 1,\n   \"price\": 1000,\n   \"summary\": \"Ride it, fast: a 2 m sweep and a 500 kg hopper.\"\n  }\n ],\n \"money\": 1250000.5,\n \"revision\": 2\n}\n"}}, {"method": "POST", "path": "/vehicles/remove", "help": "?storage=[&refund=1] : take one owned vehicle away; refund=1 pays its garage price to the team", "d": {"about": "Take one owned vehicle away (out of the world if it's out); with `refund=1` its garage price is paid to the team.", "use": "Take away a vehicle (a crew-mate's who left, or one stuck somewhere), optionally refunding its price to the team.", "params": [["storage", "text", "", "The vehicle's storage id, as `/vehicles` lists it"], ["refund", "1", "no refund", "`1`: pay its garage price to the team"]], "example": "POST /vehicles/remove?storage=g2-0&refund=1", "answer": "{\n \"ok\": true,\n \"despawned\": true,\n \"price\": 1000,\n \"moneyBefore\": 1250000.5,\n \"moneyAfter\": 1251000.5,\n \"owner\": \"76561198000000000\"\n}\n", "errors": ["`{\"ok\":false,\"reason\":\"no owned vehicle with that storage id\"}`"]}}]}, {"group": "Dev", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/dev/find", "help": "?name= : every game method by that name: class, static, parameters, returns, live objects", "d": {"about": "Find game methods by name: every class in the game's code with a method of that name, whether it's static or public, its parameters and return type, and how many live objects of the class there are.", "use": "For modders: find which game class has a method you've heard of, and how many live objects of it exist, before patching or calling it.", "params": [["name", "text", "", "The method's exact name"]], "example": "GET /dev/find?name=StepProduction", "answer": "[\n {\n  \"type\": \"MoonCleaners.MoonWorld\",\n  \"static\": false,\n  \"public\": true,\n  \"params\": \"Single\",\n  \"returns\": \"Void\",\n  \"live\": 1\n }\n]\n", "notes": ["`live`: -1 for a static method or a class that isn't a Unity object."]}}, {"method": "GET", "path": "/dev/xref", "help": "?find=text[&type=MoonCleaners.X] : game methods whose code uses a string containing text", "d": {"about": "Find game methods whose code uses a string containing some text: a cross-reference search through the game's machine code.", "use": "For modders: find the code behind a message you see in the game or the log, by searching the game's code for the text (\"looked clean\" leads to the start-up dust check).", "params": [["find", "text", "", "Text the string must contain"], ["type", "text", "every class", "Only this class (full name, for example `MoonCleaners.MoonWorld`)"]], "example": "GET /dev/xref?find=dust&type=MoonCleaners.MoonWorld", "answer": "{\n \"ok\": true,\n \"hits\": [\n  {\n   \"method\": \"MoonCleaners.MoonWorld::CargoShortName/1\",\n   \"text\": \"\\\"dust\\\"\"\n  },\n  {\n   \"method\": \"MoonCleaners.MoonWorld::CleanLookingChecked/4\",\n   \"text\": \"\\\"Moon section {0} looked clean in its saved cleaning, but {1:0.0}% of its dust is left ...\\\"\"\n  }\n ],\n \"scanned\": 1244\n}\n", "notes": ["Without `type` it scans every method in the game, which takes a while."]}}, {"method": "GET", "path": "/dev/dis", "help": "?type=MoonCleaners.X&method=Name[&n=0][&bytes=8192] : disassembly with its strings and called methods named", "d": {"about": "Disassemble a game method: its machine code, with the strings it uses and the methods it calls named. Answers in plain text.", "use": "For modders: read what a game method actually does, as machine code with the strings it uses and the methods it calls named. The way to understand a game system with no source.", "params": [["type", "text", "", "The class's full name"], ["method", "text", "", "The method's name"], ["n", "int", "0", "Which overload, when there are several"], ["bytes", "int", "8192", "How much code to read"]], "example": "GET /dev/dis?type=MoonCleaners.MoonWorld&method=StepProduction", "answer": "== MoonCleaners.MoonWorld::StepProduction/1 @ 0x6FFFF7850D10\n0000  mov rax,rsp\n0003  push rbx\n0004  push rsi\n...\n00D0  call 00006FFFF7844AC0h                          -> MoonCleaners.MoonWorld::SolvePower/1\n01B6  call 00006FFFF78194D0h                          -> MoonCleaners.MoonWorld::Processor/1\n...\n", "errors": ["`{\"ok\":false,\"reason\":\"no type\"}`", "`{\"ok\":false,\"reason\":\"no such method (2 overloads)\"}`: `n` is past the last overload"]}}, {"method": "GET", "path": "/dev/fields", "help": "?type=MoonCleaners.X : a class's fields with their memory offsets", "d": {"about": "A class's fields with their memory offsets, in plain text.", "use": "For modders: list a class's fields with their memory offsets, to read or patch game state.", "params": [["type", "text", "", "The class's full name"]], "example": "GET /dev/fields?type=MoonCleaners.MoonWorld", "answer": "0x0  MoonWorld.BeltSpeed\n0x0  MoonWorld.FarRobotStep\n0x0  MoonWorld.RailSnap\n...\n", "errors": ["`{\"ok\":false,\"reason\":\"no type\"}`"]}}, {"method": "GET", "path": "/dev/name", "help": "?addr=hex : which known method contains a code address", "d": {"about": "Which known game method contains a code address, for reading a crash or a stack.", "use": "For modders: turn a code address from a crash or a stack trace into the game method it's in.", "params": [["addr", "hex", "", "The address, with or without `0x`"]], "example": "GET /dev/name?addr=0x6FFFF7850D30", "answer": "{\n \"ok\": true,\n \"exact\": false,\n \"nearestBelow\": \"MoonCleaners.MoonWorld::StepProduction/1\",\n \"offset\": 32\n}\n", "notes": ["`exact: true` with `name` when the address is a method's start."]}}, {"method": "POST", "path": "/dev/call", "help": "?type=&method= : call a parameterless game method (static, or on every live object of the class)", "d": {"about": "Call a game method that takes no parameters: a static one, or on every live object of its class. For the game's own developer tools; nothing runs unless asked.", "use": "For modders: run one of the game's own parameterless methods on purpose, such as a developer reset hidden in the game. Use with care: it does whatever that method does.", "params": [["type", "text", "", "The class's full name"], ["method", "text", "", "The method's name"]], "example": "POST /dev/call?type=MoonCleaners.MoonWorld&method=DevResetDust", "answer": "{\n \"ok\": true,\n \"objects\": 1,\n \"returned\": [\n  \"null\"\n ]\n}\n", "errors": ["`{\"ok\":false,\"reason\":\"no such class\"}`", "`{\"ok\":false,\"reason\":\"no such method without parameters\"}`", "`\"ok\": false` with the exception it threw"], "notes": ["A static method answers `{\"ok\":true,\"static\":true,\"returned\":...}`."]}}]}, {"group": "Help", "from": "LunarLink.Api", "endpoints": [{"method": "GET", "path": "/help", "help": "?path= : every endpoint and what it does (this list); &details=1 adds LunarLink's own endpoints' parameters, examples and answers", "d": {"about": "Every endpoint there is right now, described by whoever serves it: the core's, each module's by area, and each plugin's `HttpHelp()` lines, hot or normal. LunarLink's own come with these details.", "use": "Discover what this game can do right now: every endpoint, LunarLink's and every plugin's, grouped by area. `?details=1` adds parameters, examples and these notes, so a script or tool can build itself from it.", "params": [["path", "text", "", "Only endpoints whose path starts with this"]], "example": "GET /help?path=/sun", "answer": "{\n \"groups\": [\n  {\n   \"group\": \"World\",\n   \"from\": \"LunarLink.Api\",\n   \"endpoints\": [\n    {\n     \"method\": \"GET\",\n     \"path\": \"/sun\",\n     \"help\": \"The sun: direction, height, lunar day length, clock\"\n    }\n   ]\n  }\n ]\n}\n"}}, {"method": "GET", "path": "/help.html", "help": "The same list as a searchable page, with the details: open it in a browser", "d": {"about": "The same list as a searchable page, with these details: open it in a browser.", "use": "The searchable reference with everything installed in your game, plugins' endpoints included: open it in a browser while you play.", "example": "GET /help.html", "answer": "(an HTML page)\n"}}]}, {"group": "BepPlugins", "from": "LunarLink.Window", "endpoints": [{"method": "GET", "path": "/plugins", "help": "The normal BepInEx plugins: name, guid, version, file, state, what needs them", "d": {"about": "The normal BepInEx plugins in `BepInEx/plugins/`: name, GUID, version, file, state and which other plugins need each one.", "use": "See which normal BepInEx plugins are installed, their versions, which are on, and which depend on which: the same list as F9's BEPINEX PLUGINS tab, for a script.", "example": "GET /plugins", "answer": "{\n \"plugins\": [\n  {\n   \"name\": \"LunarLink\",\n   \"guid\": \"lunarlink\",\n   \"version\": \"0.1.0\",\n   \"file\": \"LunarLink/LunarLink.dll\",\n   \"state\": \"running\",\n   \"neededBy\": []\n  },\n  {\n   \"name\": \"Moon Framework\",\n   \"guid\": \"moonsweepers.framework\",\n   \"version\": \"0.7.8\",\n   \"file\": \"MoonFramework.dll\",\n   \"state\": \"running\",\n   \"neededBy\": []\n  }\n ]\n}\n", "notes": ["`state`: `running`, `off from next start`, `off`, or `on from next start`.", "`file` is what `/plugins/disable` and `/plugins/enable` take."]}}, {"method": "POST", "path": "/plugins/disable", "help": "?file= : off from the next game start (restart required)", "d": {"about": "Turn a normal BepInEx plugin off from the next game start, by renaming its DLL to `.dll.disabled`. A loaded plugin keeps running until the restart.", "use": "Switch a mod off for the next game start without hunting for its DLL in the folders, for example to test whether a mod causes a problem. Restart to apply.", "params": [["file", "text", "", "The plugin's file as `/plugins` lists it, for example `QuantumConveyors/QuantumConveyors.dll`"]], "example": "POST /plugins/disable?file=QuantumConveyors/QuantumConveyors.dll", "answer": "{\n \"ok\": true,\n \"state\": \"off from next start\",\n \"restartRequired\": true,\n \"note\": \"restart the game to apply\"\n}\n", "errors": ["`{\"error\":\"file= is required (as GET /plugins lists it)\"}`", "`\"ok\": false` with a `reason`: no such plugin, it's already off, another plugin needs it (`... is needed by ...: turn those off first`), or it's LunarLink itself"]}}, {"method": "POST", "path": "/plugins/enable", "help": "?file= : on from the next game start (restart required)", "d": {"about": "Turn a normal BepInEx plugin back on from the next game start (renames `.dll.disabled` back). Turning one back on before restarting needs no restart.", "use": "Switch a mod back on for the next start. Turning back on one you switched off this session needs no restart at all.", "params": [["file", "text", "", "The plugin's file as `/plugins` lists it"]], "example": "POST /plugins/enable?file=QuantumConveyors/QuantumConveyors.dll", "answer": "{\n \"ok\": true,\n \"state\": \"running\",\n \"restartRequired\": false,\n \"note\": \"back to how the game started it: no restart needed\"\n}\n", "errors": ["`{\"error\":\"file= is required (as GET /plugins lists it)\"}`", "`\"ok\": false` with a `reason`: it's already on, or there's no `.dll.disabled` file"]}}]}, {"group": "Perf", "from": "LunarLink.Perf", "endpoints": [{"method": "GET", "path": "/perf", "help": "fps and ms per frame of the timed systems since the last read (read once, wait, read again); with the engine counters on, Unity's own (engineMs)", "d": {"about": "fps and milliseconds per frame since the last read: of the timed systems (`msPerFrame`), and with the engine counters on, Unity's own (`engineMs`).", "use": "Read where the frame time goes: fps, Unity's own counters (scripts, physics, rendering, GPU wait) and any timers you put in. Read once, wait 10-20 s, read again.", "example": "GET /perf", "answer": "{\n \"ok\": true,\n \"installed\": \"\",\n \"frames\": 131,\n \"fps\": 25.999,\n \"msPerFrame\": {},\n \"engineMs\": {\n  \"frames\": 131,\n  \"main thread (whole frame)\": 38.247,\n  \"player loop\": 38.242,\n  \"scripts: Update\": 19.521,\n  \"scripts: LateUpdate\": 1.41,\n  \"scripts: FixedUpdate\": 0.288,\n  \"physics\": 1.091,\n  \"animation begin\": 0,\n  \"animation end\": 0,\n  \"rendering (main thread)\": 8.498,\n  \"waiting on the GPU\": 0.005,\n  \"render thread waiting on main\": 0,\n  \"#batches\": 0,\n  \"#setpass calls\": 774,\n  \"#draw calls\": 0,\n  \"#vertices\": 32364393\n }\n}\n", "notes": ["Read once to start a window, wait, read again.", "`installed`: which timers are in (`/perf/timers`, `/perf/time`)."]}}, {"method": "POST", "path": "/perf/engine", "help": "?on=1|0 : Unity's own frame counters (frame, scripts, physics, rendering, GPU wait, draw calls) on or off", "d": {"about": "Turn Unity's own frame counters on or off: whole frame, scripts, physics, rendering, GPU wait, draw calls. They cost almost nothing.", "use": "Turn on Unity's own frame counters, the lightest way to measure (almost free). Turn them off when done.", "params": [["on", "1|0", "", "`1` on, `0` off"]], "example": "POST /perf/engine?on=1", "answer": "{\n \"ok\": true,\n \"engine\": true\n}\n"}}, {"method": "POST", "path": "/perf/timers", "help": "Stopwatches on the game's and MoonFramework's main systems, read through /perf. They cost frame time: reload or disable the module to take them out", "d": {"about": "Stopwatches on the game's and MoonFramework's main per-frame systems, read through `/perf`.", "use": "Time the game's and MoonFramework's main systems each frame, to find which one is slow on a big base. They cost frame time themselves: reload the Perf module to take them out.", "example": "POST /perf/timers", "answer": "{\n \"ok\": true,\n \"installed\": \"MoonWorld.Update, MoonMachineBelt.LateUpdate, ...\"\n}\n", "notes": ["They patch the game and cost frame time: take them out with `POST /hot/reload?name=LunarLink.Perf` (or turn the module off)."]}}, {"method": "POST", "path": "/perf/time", "help": "?type=Full.Name&method=Name/paramCount : a stopwatch on one method, read through /perf", "d": {"about": "A stopwatch on one method, read through `/perf`.", "use": "Time one particular method you suspect (`/perf/methods` lists them), read through `/perf`.", "params": [["type", "text", "", "The class's full name"], ["method", "text", "", "`Name/paramCount`, as `/perf/methods` lists it"]], "example": "POST /perf/time?type=MoonCleaners.MoonWorld&method=StepProduction/1", "answer": "{\n \"ok\": true,\n \"timed\": \"MoonCleaners.MoonWorld.StepProduction/1\"\n}\n", "errors": ["`\"ok\": false` with `no type ...` or `no method ... in it or its parents`"], "notes": ["Answers `{\"ok\":true,\"already\":true}` when it's already timed."]}}, {"method": "GET", "path": "/perf/methods", "help": "?type=X : the methods a class declares, to pick what to time", "d": {"about": "The methods a class declares, as `Name/paramCount`, to pick one to time.", "use": "List a class's methods, to pick one for `/perf/time`.", "params": [["type", "text", "", "The class's full name"]], "example": "GET /perf/methods?type=MoonCleaners.MoonWorld", "answer": "{\n \"ok\": true,\n \"type\": \"MoonCleaners.MoonWorld\",\n \"assembly\": \"Assembly-CSharp\",\n \"methods\": [\n  \"SnapshotDepots/1\",\n  \"RestoreDepots/1\",\n  \"RestoreCanisters/1\"\n ]\n}\n"}}, {"method": "GET", "path": "/census", "help": "?top= : every component class counted, with which have per-frame methods", "d": {"about": "Every component in the scene counted by class, with which classes have per-frame methods. Where the frame might be going.", "use": "Count every component in the scene by class: shows what there's thousands of (belts, lights, machines) and which run code every frame.", "params": [["top", "int", "40", "How many classes to list, most common first"]], "example": "GET /census?top=5", "answer": "{\n \"ok\": true,\n \"components\": 2914,\n \"classes\": 127,\n \"top\": [\n  {\n   \"type\": \"UnityEngine.Rendering.Universal.UniversalAdditionalLightData\",\n   \"n\": 500,\n   \"calls\": \"\"\n  },\n  {\n   \"type\": \"MoonCleaners.MoonMachineBelt\",\n   \"n\": 444,\n   \"calls\": \"LateUpdate\"\n  },\n  {\n   \"type\": \"MoonCleaners.MoonSolarPanelView\",\n   \"n\": 324,\n   \"calls\": \"Update\"\n  }\n ]\n}\n"}}, {"method": "GET", "path": "/perf/fixes", "help": "The fps fixes: power (fast link on, offer back-off frames) and audio (silent beyond m metres), with their counters", "d": {"about": "The fps fixes and their counters: power (the fast power link, and the back-off for capsule offers at full lines) and audio (machine sounds silenced beyond a distance).", "use": "See whether the fps fixes are on and what they're doing (power links run, capsule offers skipped, sounds silenced).", "example": "GET /perf/fixes", "answer": "{\n \"power\": {\n  \"ok\": true,\n  \"on\": true,\n  \"installed\": true,\n  \"fastRuns\": 1192,\n  \"fastLastMs\": 0.07,\n  \"fastAvgMs\": 0.081,\n  \"modRuns\": 0,\n  \"modAvgMs\": 0,\n  \"offerBackoff\": 4,\n  \"offersRun\": 659588,\n  \"offersSkipped\": 846326,\n  \"offersTaken\": 77118,\n  \"reason\": null\n },\n \"audio\": {\n  \"ok\": true,\n  \"farMetres\": 60,\n  \"installed\": true,\n  \"silenced\": 402144,\n  \"passed\": 10851996,\n  \"reason\": null\n }\n}\n"}}, {"method": "POST", "path": "/perf/fixes/modify", "help": "?name=power&on=1|0 / ?name=power&backoff=N / ?name=audio&m=N (0 = off) : change a fix and keep the setting", "d": {"about": "Change an fps fix; the setting is kept for the next start.", "use": "Switch an fps fix on or off, or tune it, live: compare the frame rate with and without it.", "params": [["name", "power|audio", "", "Which fix"], ["on", "1|0", "", "With `name=power`: the fast power link on or off"], ["backoff", "int", "", "With `name=power`: frames a refused capsule waits before it's offered again"], ["m", "number", "60", "With `name=audio`: metres beyond which machine sounds stop (0 = off)"]], "example": "POST /perf/fixes/modify?name=audio&m=80", "answer": "{\n \"ok\": true,\n \"audio\": {\n  \"ok\": true,\n  \"farMetres\": 80,\n  \"installed\": true,\n  \"silenced\": 0,\n  \"passed\": 0,\n  \"reason\": null\n }\n}\n", "errors": ["`{\"ok\":false,\"reason\":\"name=power or name=audio\"}`"]}}]}, {"group": "Update", "from": "LunarLink.Update", "endpoints": [{"method": "GET", "path": "/update", "help": "What LunarLink's updater knows: the running version, the latest release, each module in the module channel, each plugin with an UpdateFeed(), and how far an update got", "d": {"about": "What LunarLink's updater knows: the running version, the latest release (after `/update/check`), its notes, how far an update got, and each module in the module channel. Nothing here contacts GitHub.", "use": "What's installed and what's newer: LunarLink's release, each module, each plugin with updates. For a script or an overlay that tells you when to update.", "example": "GET /update", "answer": "{\n \"ok\": true,\n \"running\": \"0.3.0\",\n \"state\": \"up to date\",\n \"latest\": \"0.3.0\",\n \"page\": \"https://github.com/swheettaos/lunarlink/releases/tag/v0.3.0\",\n \"size\": 132053,\n \"coreChanged\": null,\n \"detail\": \"LunarLink 0.3.0 is the latest release\",\n \"error\": null,\n \"notes\": \"- **Module channel.** Every push to main is built on GitHub ...\",\n \"channel\": {\n  \"error\": null,\n  \"modules\": [\n   {\n    \"name\": \"LunarLink.Api\",\n    \"state\": \"up to date\",\n    \"note\": \"Api: /dev/dis reads small ?bytes= too (below 256 it read nothing)\",\n    \"built\": \"2026-11-14 00:56:10 UTC\",\n    \"commit\": \"83eaf7ae3a7c\",\n    \"size\": 147968,\n    \"error\": null\n   },\n   {\n    \"name\": \"LunarLink.Perf\",\n    \"state\": \"up to date\",\n    \"note\": \"Perf: reach MoonFramework by name, so LunarLink no longer builds against it\",\n    \"built\": \"2026-11-14 00:52:40 UTC\",\n    \"commit\": \"5ac09763a51f\",\n    \"size\": 32768,\n    \"error\": null\n   },\n   {\n    \"name\": \"LunarLink.Window\",\n    \"state\": \"up to date\",\n    \"note\": \"Module channel: CI publishes changed modules; F9 offers each one and reloads it in place\",\n    \"built\": \"2026-11-14 00:52:40 UTC\",\n    \"commit\": \"fe46c3faccb3\",\n    \"size\": 28672,\n    \"error\": null\n   }\n  ]\n }\n}\n", "notes": ["`state` (the release): `idle`, `checking`, `up to date`, `available`, `downloading`, `reloading`, `done` (modules reloaded, no restart), `restart` (a new core is in place: restart the game) or `failed` (see `error`).", "`coreChanged`: known once a release is downloaded: `false` means its modules reloaded in place, `true` that the core changed and the game needs a restart.", "`channel.modules[].state`: `up to date`, `available` (a newer build from main), `needs core` (built for a newer core: install the next release first), `downloading`, `reloading`, `updated` or `failed`.", "`autoCheck`: whether it checks by itself once at every game start (`POST /update/modify?auto=`).", "`plugins`: each plugin that answers `UpdateFeed()`: `name`, `kind` (`hot` or `plugin`), `version`, `latest`, `state` (`checking`, `up to date`, `available`, `downloading`, `reloading`, `updated`, `restart`, `failed`), `from` (where it comes from), `notes`, `error`.", "The F9 window's UPDATES tab shows the same, with Check for updates and an Update button on each row."]}}, {"method": "POST", "path": "/update/modify", "help": "?auto=1|0 : check for updates by itself once a moon is loaded, at every game start (off by default: checking is manual)", "d": {"about": "Turn \"check for updates at game start\" on or off: when on, LunarLink checks GitHub once by itself at every game start, after the moon loads (not on module reloads). Off by default: checking is manual. It's the checkbox on F9's UPDATES tab.", "use": "Have LunarLink check for updates by itself at every game start (off by default).", "params": [["auto", "1|0", "", "`1` on, `0` off"]], "example": "POST /update/modify?auto=1", "answer": "{\"ok\": true, \"autoCheck\": true}\n", "notes": ["Kept in `BepInEx/plugins/LunarLink/update_auto.txt`. It only checks: nothing is installed until you press Update."]}}, {"method": "POST", "path": "/update/check", "help": "Ask GitHub for LunarLink's latest release and the module channel, and each plugin's update feed, then read GET /update (changes nothing)", "d": {"about": "Ask GitHub for LunarLink's latest release and the module channel's `modules.json`, in the background; read `GET /update` for the answer. LunarLink never checks by itself: only this request (or F9's button) contacts GitHub, and once after a core update you started, when the game is back.", "use": "Ask GitHub for news (the latest release, module builds, plugins' feeds), then read `/update`.", "example": "POST /update/check", "answer": "{\"ok\": true, \"running\": \"0.3.0\", \"state\": \"checking\", \"latest\": null, \"page\": null, \"size\": 0, \"coreChanged\": null, \"detail\": null, \"error\": null, \"notes\": null, \"channel\": {\"error\": null, \"modules\": []}}\n", "notes": ["A POST because it starts something, but it changes nothing in the game: it works without `allow-writes`.", "It asks `api.github.com/repos/swheettaos/lunarlink/releases/latest` and downloads the `modules` prerelease's `modules.json`, with only a generic `LunarLink-updater` user agent."]}}, {"method": "POST", "path": "/update/apply", "help": "Install the latest release (modules reload in place; a new core needs a restart), or ?module=<name>|all: modules from the channel, reloaded in place, or ?plugin=<name>: a plugin's own update (UpdateFeed). ?force=1 reinstalls the same release", "d": {"about": "Install an update. Without `module`: the latest release. Its zip is checked against the SHA-256 GitHub publishes; if the core didn't change, the modules go into `BepInEx/hot/` and reload in place, and if it did, the new core replaces the running one for the next start (the running file is renamed to `LunarLink.dll.old`) and the modules wait until then. With `module`: that module's newer build from the module channel, checked against `modules.json`'s SHA-256 and reloaded in place.", "use": "Install an update from a script: a release, one module or all, or a plugin. Modules and hot plugins reload in place; only a new core needs a restart.", "params": [["module", "text", "", "A module's name (`LunarLink.Api`), or `all`: every module with a newer build. Only builds made for the installed core are taken"], ["plugin", "text", "", "A plugin's name, as `GET /update` lists it under `plugins`: its own update, from where its `UpdateFeed()` says"], ["force", "1", "", "Without `module`: install the latest release even when it's the version already running (a repair)"]], "example": "POST /update/apply?module=LunarLink.Api", "answer": "{\"ok\": true, \"running\": \"0.3.0\", \"state\": \"up to date\", \"...\": \"...\", \"channel\": {\"error\": null, \"modules\": [{\"name\": \"LunarLink.Api\", \"state\": \"downloading\", \"note\": \"Api: /structures answers kinds by name too\", \"built\": \"2026-11-14 01:02:11 UTC\", \"commit\": \"3f1c2a9d0b4e\", \"size\": 145920, \"error\": null}]}}\n", "errors": ["`{\"ok\":false,\"reason\":\"check first: POST /update/check\"}`", "`{\"ok\":false,\"reason\":\"no newer release (force=1 reinstalls it)\"}`", "`{\"ok\":false,\"reason\":\"LunarLink.Api is built for a newer core: install the next LunarLink release first\"}`", "`state: failed` (release) or a module's `state: failed` in `GET /update`, with the reason in `error`: the download didn't match its SHA-256, the zip didn't hold LunarLink's files, or a module failed to start. Nothing is installed when the check fails."], "notes": ["It runs in the background: follow it with `GET /update` until the release's `state` is `done` or `restart`, or the module's is `updated`.", "Only LunarLink's own files are taken from a release zip (`BepInEx/plugins/LunarLink/*` and `BepInEx/hot/LunarLink.*.dll`).", "A module you turned off stays off; it loads the new build when you turn it on.", "After a core update, the game checks once more when it's back, so module builds newer than that release are offered."]}}]}], "note": "LunarLink's own endpoints; the running game's /help.html adds the plugins'"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let group = null;
function hi(text, words) {
  let out = esc(text);
  for (const w of words) if (w) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return out;
}
// a little Markdown: `code` and **bold**
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const open = new Set();
function rows(list) {
  return `<div class="tbl"><table><tr><th>Name</th><th>Type</th><th>Default</th><th>Meaning</th></tr>` +
    list.map(([n, t, d, m]) => `<tr><td><code>${esc(n)}</code></td><td>${esc(t)}</td><td>${esc(d || "-")}</td><td>${md(m)}</td></tr>`).join("") + `</table></div>`;
}
function detail(e) {
  const d = e.d; let h = `<div class="d"><p>${md(d.about || e.help)}</p>`;
  if (d.use) h += `<h4>What it's for</h4><p class="use">${md(d.use)}</p>`;
  if (d.params && d.params.length) h += `<h4>Parameters</h4>` + rows(d.params);
  if (d.body && d.body.length) h += `<h4>Body (JSON)</h4>` + rows(d.body);
  if (d.example) h += `<h4>Example</h4><pre>${esc(d.example.trimEnd())}</pre>`;
  if (d.answer) h += `<h4>Answer</h4><pre>${esc(d.answer.trimEnd())}</pre>`;
  if (d.errors && d.errors.length) h += `<h4>Errors</h4><ul>${d.errors.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  if (d.notes && d.notes.length) h += `<h4>Notes</h4><ul>${d.notes.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  return h + `</div>`;
}
const text = e => [e.method, e.path, e.help, e.d && e.d.about, e.d && e.d.use, e.d && (e.d.notes || []).join(" "), e.d && (e.d.params || []).map(p => p.join(" ")).join(" ")].join(" ").toLowerCase();
function render() {
  const words = document.getElementById("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, html = "";
  for (const g of DATA.groups) {
    if (group && g.group !== group) continue;
    const eps = g.endpoints.filter(e => words.every(w => (text(e) + " " + g.group.toLowerCase()).includes(w)));
    if (!eps.length) continue;
    shown += eps.length;
    html += `<section><h2>${esc(g.group)} <span class="from">${esc(g.from)}</span></h2>` + eps.map(e => {
      const key = e.method + " " + e.path, has = !!e.d;
      return `<div class="ep${has ? " has" : ""}${open.has(key) ? " open" : ""}" data-k="${esc(key)}" id="${esc(e.path.replace(/\//g, "-").replace(/^-/, "") || "root")}">` +
        `<div class="line"><span class="m ${esc(e.method)}">${esc(e.method)}</span><span class="p">${hi(e.path, words)}</span>` +
        (e.method === "POST" && e.d && !/changes nothing/.test(e.help) ? `<span class="w" title="Changes the game: needs allow-writes">writes</span>` : "") +
        (has ? `<span class="tw">▸</span>` : "") + `</div>` +
        (e.help ? `<div class="h">${hi(e.help, words)}</div>` : "") + (has ? detail(e) : "") + `</div>`;
    }).join("") + `</section>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="none">Nothing matches.</div>`;
  const total = DATA.groups.reduce((n, g) => n + g.endpoints.length, 0);
  document.getElementById("sub").textContent = `${shown} of ${total} endpoints` + (DATA.note ? " · " + DATA.note : "");
}
function chips() {
  const names = [null, ...new Set(DATA.groups.map(g => g.group))];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  for (const n of names) {
    const b = document.createElement("button");
    b.className = "chip" + (n === group ? " on" : ""); b.textContent = n ?? "All";
    b.onclick = () => { group = n; chips(); render(); };
    box.appendChild(b);
  }
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("list").addEventListener("click", ev => {
  if (ev.target.closest(".d")) return;                      // selecting text in the details doesn't close them
  const ep = ev.target.closest(".ep.has"); if (!ep) return;
  const k = ep.dataset.k; open.has(k) ? open.delete(k) : open.add(k); ep.classList.toggle("open");
});
const all = on => { for (const g of DATA.groups) for (const e of g.endpoints) if (e.d) on ? open.add(e.method + " " + e.path) : open.delete(e.method + " " + e.path); render(); };
document.getElementById("openall").onclick = () => all(true);
document.getElementById("closeall").onclick = () => all(false);
// a link to #structures-remove opens that endpoint
if (location.hash) {
  for (const g of DATA.groups) for (const e of g.endpoints) if ("#" + e.path.replace(/\//g, "-").replace(/^-/, "") === location.hash) open.add(e.method + " " + e.path);
}
chips(); render();
// the browser jumps to the #anchor itself; each endpoint's scroll-margin keeps it below the sticky header
const setMargin = () => document.documentElement.style.setProperty("--head", document.querySelector("header").offsetHeight + 8 + "px");
setMargin(); addEventListener("resize", setMargin);
if (location.hash) { const el = document.querySelector(location.hash.replace(/[^#\w-]/g, "")); if (el) el.scrollIntoView(); }
</script>
