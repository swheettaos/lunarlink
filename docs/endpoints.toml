["/update"]
about = "What LunarLink's updater knows: the running version, the latest release (after `/update/check`), its notes, how far an update got, and each module in the module channel. Nothing here contacts GitHub."
use = "What's installed and what's newer: LunarLink's release, each module, each plugin with updates. For a script or an overlay that tells you when to update."
example = "GET /update"
answer = '''
{
 "ok": true,
 "running": "0.3.0",
 "state": "up to date",
 "latest": "0.3.0",
 "page": "https://github.com/swheettaos/lunarlink/releases/tag/v0.3.0",
 "size": 132053,
 "coreChanged": null,
 "detail": "LunarLink 0.3.0 is the latest release",
 "error": null,
 "notes": "- **Module channel.** Every push to main is built on GitHub ...",
 "channel": {
  "error": null,
  "modules": [
   {
    "name": "LunarLink.Api",
    "state": "up to date",
    "note": "Api: /dev/dis reads small ?bytes= too (below 256 it read nothing)",
    "built": "2026-11-14 00:56:10 UTC",
    "commit": "83eaf7ae3a7c",
    "size": 147968,
    "error": null
   },
   {
    "name": "LunarLink.Perf",
    "state": "up to date",
    "note": "Perf: reach MoonFramework by name, so LunarLink no longer builds against it",
    "built": "2026-11-14 00:52:40 UTC",
    "commit": "5ac09763a51f",
    "size": 32768,
    "error": null
   },
   {
    "name": "LunarLink.Window",
    "state": "up to date",
    "note": "Module channel: CI publishes changed modules; F9 offers each one and reloads it in place",
    "built": "2026-11-14 00:52:40 UTC",
    "commit": "fe46c3faccb3",
    "size": 28672,
    "error": null
   }
  ]
 }
}
'''
notes = [
  "`state` (the release): `idle`, `checking`, `up to date`, `available`, `downloading`, `reloading`, `done` (modules reloaded, no restart), `restart` (a new core is in place: restart the game) or `failed` (see `error`).",
  "`coreChanged`: known once a release is downloaded: `false` means its modules reloaded in place, `true` that the core changed and the game needs a restart.",
  "`channel.modules[].state`: `up to date`, `available` (a newer build from main), `needs core` (built for a newer core: install the next release first), `downloading`, `reloading`, `updated` or `failed`.",
  "`autoCheck`: whether it checks by itself once at every game start (`POST /update/modify?auto=`).",
  "`plugins`: each plugin that answers `UpdateFeed()`: `name`, `kind` (`hot` or `plugin`), `version`, `latest`, `state` (`checking`, `up to date`, `available`, `downloading`, `reloading`, `updated`, `restart`, `failed`), `from` (where it comes from), `notes`, `error`.",
  "The F9 window's UPDATES tab shows the same, with Check for updates and an Update button on each row.",
]

["/update/check"]
about = "Ask GitHub for LunarLink's latest release and the module channel's `modules.json`, in the background; read `GET /update` for the answer. LunarLink never checks by itself: only this request (or F9's button) contacts GitHub, and once after a core update you started, when the game is back."
use = "Ask GitHub for news (the latest release, module builds, plugins' feeds), then read `/update`."
example = "POST /update/check"
answer = '''
{"ok": true, "running": "0.3.0", "state": "checking", "latest": null, "page": null, "size": 0, "coreChanged": null, "detail": null, "error": null, "notes": null, "channel": {"error": null, "modules": []}}
'''
notes = [
  "A POST because it starts something, but it changes nothing in the game: it works without `allow-writes`.",
  "It asks `api.github.com/repos/swheettaos/lunarlink/releases/latest` and downloads the `modules` prerelease's `modules.json`, with only a generic `LunarLink-updater` user agent.",
]

["/update/apply"]
about = "Install an update. Without `module`: the latest release. Its zip is checked against the SHA-256 GitHub publishes; if the core didn't change, the modules go into `BepInEx/hot/` and reload in place, and if it did, the new core replaces the running one for the next start (the running file is renamed to `LunarLink.dll.old`) and the modules wait until then. With `module`: that module's newer build from the module channel, checked against `modules.json`'s SHA-256 and reloaded in place."
use = "Install an update from a script: a release, one module or all, or a plugin. Modules and hot plugins reload in place; only a new core needs a restart."
params = [
  ["module", "text", "", "A module's name (`LunarLink.Api`), or `all`: every module with a newer build. Only builds made for the installed core are taken"],
  ["plugin", "text", "", "A plugin's name, as `GET /update` lists it under `plugins`: its own update, from where its `UpdateFeed()` says"],
  ["force", "1", "", "Without `module`: install the latest release even when it's the version already running (a repair)"],
]
example = "POST /update/apply?module=LunarLink.Api"
answer = '''
{"ok": true, "running": "0.3.0", "state": "up to date", "...": "...", "channel": {"error": null, "modules": [{"name": "LunarLink.Api", "state": "downloading", "note": "Api: /structures answers kinds by name too", "built": "2026-11-14 01:02:11 UTC", "commit": "3f1c2a9d0b4e", "size": 145920, "error": null}]}}
'''
errors = [
  "`{\"ok\":false,\"reason\":\"check first: POST /update/check\"}`",
  "`{\"ok\":false,\"reason\":\"no newer release (force=1 reinstalls it)\"}`",
  "`{\"ok\":false,\"reason\":\"LunarLink.Api is built for a newer core: install the next LunarLink release first\"}`",
  "`state: failed` (release) or a module's `state: failed` in `GET /update`, with the reason in `error`: the download didn't match its SHA-256, the zip didn't hold LunarLink's files, or a module failed to start. Nothing is installed when the check fails.",
]
notes = [
  "It runs in the background: follow it with `GET /update` until the release's `state` is `done` or `restart`, or the module's is `updated`.",
  "Only LunarLink's own files are taken from a release zip (`BepInEx/plugins/LunarLink/*` and `BepInEx/hot/LunarLink.*.dll`).",
  "A module you turned off stays off; it loads the new build when you turn it on.",
  "After a core update, the game checks once more when it's back, so module builds newer than that release are offered.",
]

["/update/modify"]
