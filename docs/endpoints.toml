["/belts/check"]
about = "Ask the game whether a belt can be built between two points: whether it's routable, its length and its price. Builds nothing."
use = "Before laying a belt from a script, ask whether the game will accept that route, how long it is and what it costs. Use `/kit` for the limits (longest belt, tightest turn, steepest slope)."
body = [
  ["start, end", "[x,y,z]", "", "Where the belt starts and ends"],
  ["startDir, endDir", "[x,y,z]", "forward", "Its direction at each end"],
  ["startStructure, endStructure", "int", "-1", "The machine or catcher port it connects to at each end, by structure id"],
  ["startBelt, endBelt", "int", "-1", "The belt it continues from or into, by belt id"],
  ["replaces", "int", "-1", "A belt this one replaces"],
  ["startUp, endUp", "[x,y,z]", "away from the moon's centre", "The up direction at each end"],
]
example = '''
POST /belts/check
{"start":[10,2000,-4],"startDir":[1,0,0],"end":[20,2000,-4],"endDir":[1,0,0]}
'''
answer = '''
{
 "ok": true,
 "reason": null,
 "routable": true,
 "length": 10.02,
 "price": "5.01"
}
'''
errors = [
  "`{\"error\":\"no local player\"}`",
  "`\"ok\": false` with the game's `reason`",
]
notes = [
  "Works without `allow-writes`: it changes nothing.",
  "`price` is a string (the game's decimal). `/kit` has the limits: length, radius, slope, height.",
]

