["/dev/call"]
about = "Call a game method that takes no parameters: a static one, or on every live object of its class. For the game's own developer tools; nothing runs unless asked."
use = "For modders: run one of the game's own parameterless methods on purpose, such as a developer reset hidden in the game. Use with care: it does whatever that method does."
params = [
  ["type", "text", "", "The class's full name"],
  ["method", "text", "", "The method's name"],
]
example = "POST /dev/call?type=MoonCleaners.MoonWorld&method=DevResetDust"
answer = '''
{
 "ok": true,
 "objects": 1,
 "returned": [
  "null"
 ]
}
'''
errors = [
  "`{\"ok\":false,\"reason\":\"no such class\"}`",
  "`{\"ok\":false,\"reason\":\"no such method without parameters\"}`",
  "`\"ok\": false` with the exception it threw",
]
notes = [
  "A static method answers `{\"ok\":true,\"static\":true,\"returned\":...}`.",
]

["/dev/dis"]
about = "Disassemble a game method: its machine code, with the strings it uses and the methods it calls named. Answers in plain text."
use = "For modders: read what a game method actually does, as machine code with the strings it uses and the methods it calls named. The way to understand a game system with no source."
params = [
  ["type", "text", "", "The class's full name"],
  ["method", "text", "", "The method's name"],
  ["n", "int", "0", "Which overload, when there are several"],
  ["bytes", "int", "8192", "How much code to read"],
]
example = "GET /dev/dis?type=MoonCleaners.MoonWorld&method=StepProduction"
answer = '''
== MoonCleaners.MoonWorld::StepProduction/1 @ 0x6FFFF7850D10
0000  mov rax,rsp
0003  push rbx
0004  push rsi
...
00D0  call 00006FFFF7844AC0h                          -> MoonCleaners.MoonWorld::SolvePower/1
01B6  call 00006FFFF78194D0h                          -> MoonCleaners.MoonWorld::Processor/1
...
'''
errors = [
  "`{\"ok\":false,\"reason\":\"no type\"}`",
  "`{\"ok\":false,\"reason\":\"no such method (2 overloads)\"}`: `n` is past the last overload",
]

