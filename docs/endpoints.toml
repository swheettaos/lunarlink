# Details for every LunarLink endpoint: what it does, its parameters, its body, an example and what it answers.
# tools/endpoints.py merges this with the routes in the code and writes docs/api.html, the in-game /help and /help.html
# (src/LunarLink.Api/endpoints.json) and the wiki's API Reference. It warns about an endpoint with no entry here, and an
# entry for an endpoint that's gone. Answers are real, from a running game, cut to a couple of items.
#
# about: what it does. use: what it's for (typical uses, what it goes with). params and body: [name, type, default,
# meaning]. errors and notes: Markdown.


["/base/health"]
about = "Is the base round a point working? Lists only real problems: machines the game says are stuck (with its reason), catchers with a dead outlet, robots docked there that aren't cleaning, and power grids short anywhere. Idle machines are only counted."
use = "One call answers \"is this base working?\": it lists only real problems (stuck machines with the game's reason, catchers with a dead outlet, idle robots docked there, short power grids). Run it round a base after building or changing it, or from a script on a timer."
params = [
  ["x, y, z", "number", "0", "A world point (the moon's centre is 0,0,0; its surface is about 2000 m out)"],
  ["r", "number", "100", "Radius in metres round the point"],
]
example = "GET /base/health?x=0&y=1992&z=-11&r=150"
answer = '''
{
 "machines": [],
 "catchers": [],
 "robots": [],
 "shortGrids": [],
 "here": {
  "machines": 468,
  "idleMachines": 324,
  "catchers": 48,
  "robots": 0
 },
 "problems": 0,
 "ok": true
}
'''
notes = [
  "Problem shapes: `machines` `{id, kind, status, flow, power}`; `catchers` `{id, kg, full, outlet}`; `robots` `{dock, number, status, kg}`; `shortGrids` `{id, machines, satisfaction, supplyKw, demandKw, storedKwh}`.",
  "`here`: what's within the radius. `ok` is true when `problems` is 0.",
]

