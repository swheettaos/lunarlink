["/camera/modify"]
about = "Put an observer camera somewhere, looking at a point: a second camera drawn on top of the game's, which stays where it's put while the player moves (for recording). The game's look-at cards are hidden while it's on."
use = "**Film or watch from a fixed angle.** An observer camera stays where you put it while the player walks about, so a script can build a base with the player running from spot to spot and the picture stays steady: for recording a timelapse, watching a long build, or a screenshot from the sky. `hide=1` stops the game's own camera drawing underneath, which is cheaper. The game's info cards stay hidden while it's on."
params = [
  ["x, y, z", "number", "0", "Where the camera stands"],
  ["tx, ty, tz", "number", "0", "The point it looks at"],
  ["fov", "number", "the game's", "Field of view in degrees"],
  ["hide", "1", "", "`1`: the game's own camera stops drawing underneath (cheaper)"],
]
example = "POST /camera/modify?x=40&y=2030&z=-40&tx=0&ty=1992&tz=-11&hide=1"
answer = '''
{
 "ok": true,
 "camera": "observer",
 "pos": [
  40,
  2030,
  -40
 ],
 "fov": 60
}
'''

