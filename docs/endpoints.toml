use = "Have LunarLink check for updates by itself at every game start (off by default)."
params = [
  ["auto", "1|0", "", "`1` on, `0` off"],
]
example = "POST /update/modify?auto=1"
answer = '''
{"ok": true, "autoCheck": true}
'''
notes = [
  "Kept in `BepInEx/plugins/LunarLink/update_auto.txt`. It only checks: nothing is installed until you press Update.",
]
