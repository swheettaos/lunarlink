]

["/dev/xref"]
about = "Find game methods whose code uses a string containing some text: a cross-reference search through the game's machine code."
use = "For modders: find the code behind a message you see in the game or the log, by searching the game's code for the text (\"looked clean\" leads to the start-up dust check)."
params = [
  ["find", "text", "", "Text the string must contain"],
  ["type", "text", "every class", "Only this class (full name, for example `MoonCleaners.MoonWorld`)"],
]
example = "GET /dev/xref?find=dust&type=MoonCleaners.MoonWorld"
answer = '''
{
 "ok": true,
 "hits": [
  {
   "method": "MoonCleaners.MoonWorld::CargoShortName/1",
   "text": "\"dust\""
  },
  {
   "method": "MoonCleaners.MoonWorld::CleanLookingChecked/4",
   "text": "\"Moon section {0} looked clean in its saved cleaning, but {1:0.0}% of its dust is left ...\""
  }
