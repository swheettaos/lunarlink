]

["/hot/list"]
about = "Every DLL in `BepInEx/hot/`: its state, the loaded build's time, whether a newer build is on disk, its error, leftovers and the old copies still in memory."
use = "See whether your plugins are running, which failed and why, and whether a newer build is waiting on disk. With `?gc=1`, check that reloads don't pile up old copies in memory (`oldCopiesAlive` should stay 0 or 1)."
params = [
  ["gc", "1", "", "Collect garbage first (three passes), so `oldCopiesAlive` is exact. A short hitch"],
]
example = "GET /hot/list?gc=1"
answer = '''
{
 "dir": "C:\\Games\\Moon Sweepers\\BepInEx\\hot",
 "bridges": {
  "kept": 114,
  "freed": 0,
  "typesFreed": 0,
  "waiting": 0,
  "problem": null
 },
 "plugins": [
  {
   "name": "LunarLink.Api",
   "state": "running",
   "built": "2026-11-13 15:34:04",
   "error": null,
   "loads": 1,
   "boot": false,
   "newerOnDisk": false,
   "leftovers": [],
   "oldCopiesAlive": 0,
   "oldCopies": 0
  },
  {
   "name": "LunarLink.Perf",
   "state": "running",
   "built": "2026-11-13 15:34:04",
   "error": null,
   "loads": 1,
   "boot": false,
   "newerOnDisk": false,
   "leftovers": [],
   "oldCopiesAlive": 0,
   "oldCopies": 0
  }
 ]
}
'''
notes = [
  "`state`: `running`, `loaded` (waiting for a moon), `disabled` or `failed` (with `error`).",
  "`boot`: `false` (no `Boot()`), `\"done\"`, or `\"restart to boot\"` when it was turned on after game start.",
  "`leftovers`: Harmony patches still in after its last `Stop()`, which LunarLink took out.",
  "`bridges`: the clean-up of Il2CppInterop and Harmony caches that frees old copies.",
]

["/hot/reload"]
about = "Reload a hot plugin from the build on disk now: the old copy's `Stop()`, then the new copy's `Start(state)` with what it handed over. Turns the plugin on if it was off."
use = "The heart of the edit-build-reload loop: after building a plugin into `BepInEx/hot/`, call this and the game runs the new code within a frame. `./build.sh --hot` calls it for you; `?all=1` picks up everything you rebuilt."
params = [
  ["name", "text", "", "The plugin's name: its DLL's name without `.dll`, as `/hot/list` shows it"],
  ["all", "1", "", "Instead of `name`: reload every enabled plugin with a newer build on disk"],
]
example = "POST /hot/reload?name=HelloHot"
answer = '''
{
 "ok": true,
 "ms": 12,
 "plugin": {
  "name": "HelloHot",
  "state": "running",
  "built": "2026-11-13 16:02:11",
  "error": null,
  "loads": 4,
  "boot": false,
  "newerOnDisk": false,
  "leftovers": []
 }
}
'''
errors = [
  "`{\"error\":\"name= is required\"}`",
  "`{\"error\":\"no HelloHot.dll\"}`: no such DLL in `BepInEx/hot/`",
  "`\"ok\": false` with the reason in `plugin.error`: it didn't load, or its `Start` threw; it's unloaded again",
]
notes = [
  "With `all=1` the answer is `{\"ok\":true,\"ms\":40,\"reloaded\":[ ...one entry per plugin... ]}`.",
  "`./build.sh --hot <Name>` builds, copies and calls this for you.",
]

